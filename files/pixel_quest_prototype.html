<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ここちゃんとなるちゃんの冒険</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ここちゃんの冒険">
<meta name="theme-color" content="#1a2040">
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2040;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;color:#F4F6FF}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{display:block;width:100%;height:100%;touch-action:none}

/* ===== HUD ===== */
.hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700;font-size:13px;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.hud .left,.hud .right{display:flex;align-items:center;gap:8px}
#stageLabel{color:#fff;letter-spacing:.04em}
#coinCount{color:#FFD23F}
#timer{color:#fff;font-variant-numeric:tabular-nums}
.icon-btn{pointer-events:auto;width:36px;height:36px;background:rgba(0,0,0,.35);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);font-size:16px;color:#fff}
.icon-btn.off{opacity:.4}
.pause-icon{display:block;width:11px;height:13px;border-left:4px solid #fff;border-right:4px solid #fff}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;background:rgba(11,15,42,.85);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.card{background:#1e2550;border-top:4px solid #FF4D6D;padding:26px 22px;border-radius:14px;text-align:center;min-width:280px;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card h2{font-size:24px;margin-bottom:14px;color:#FFD23F}
.card .stars{font-size:28px;margin:8px 0 12px;letter-spacing:4px}
.card .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(154,163,199,.2)}
.card .stat:last-of-type{border-bottom:none;margin-bottom:14px}
.card .stat .lbl{color:#9AA3C7}
.card .stat .val{color:#F4F6FF;font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .06s ease;color:#fff}
.btn:active{transform:scale(.97)}
.btn.primary{background:#FF4D6D}
.btn.secondary{background:rgba(255,255,255,.1);color:#F4F6FF}

/* ===== Story modal ===== */
#storyModal .card{max-width:350px}
#storyText{font-size:13px;line-height:1.85;color:#C8D0E8;text-align:left;white-space:pre-wrap}

/* ===== Tutorial ===== */
.tutorial{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;pointer-events:auto;backdrop-filter:blur(2px);cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.tutorial.show{display:flex}
.tut-card{background:#1e2550;border:2px solid #FF4D6D;padding:22px 26px;border-radius:14px;text-align:center;max-width:300px}
.tut-card h2{font-size:19px;color:#FFD23F;margin-bottom:10px}
.tut-card p{font-size:13px;line-height:1.7;margin-bottom:4px}
.tut-card .big{font-size:34px;margin:6px 0}
.tut-card .hint{font-size:11px;color:#9AA3C7;margin-top:12px}

/* ===== Title screen ===== */
.title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;background:linear-gradient(180deg,#0d1525 0%,#1a2040 100%)}
.title h1{font-size:clamp(20px,6.5vw,36px);font-weight:900;letter-spacing:2px;text-align:center;padding:0 14px;color:#F4F6FF;text-shadow:0 3px 16px rgba(255,77,109,.5)}
.title .sub{color:#3DDCFF;font-size:12px;letter-spacing:3px;font-weight:700;margin-top:6px}
.title .tap{margin-top:36px;font-size:15px;color:#FFD23F;animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.25}}
.dots{position:absolute;top:22px;display:flex;gap:7px}
.dots.l{left:20px}.dots.r{right:20px}
.dots span{width:12px;height:12px;border-radius:2px}
.d1{background:#FF4D6D}.d2{background:#FFD23F}.d3{background:#3DDCFF}

/* ===== Debug ===== */
#dbg{position:fixed;bottom:6px;left:6px;font-size:9px;color:#FFD23F;opacity:.65;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:4px;z-index:9999;pointer-events:none;font-family:monospace}
#dbg2{position:fixed;bottom:24px;left:6px;right:6px;font-size:10px;color:#3DDCFF;opacity:.9;background:rgba(0,0,0,.65);padding:4px 7px;border-radius:4px;z-index:9999;pointer-events:none;font-family:monospace;word-break:break-all;line-height:1.3}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="dbg2"></div>
  <!-- HUD -->
  <div class="hud" id="hud" style="display:none">

  <!-- Pause -->
  <div class="modal" id="pauseModal">

// ============================================================
// AudioEngine: BGM/SE エンジン
//
// 設計上の約束:
//   1. AudioContext生成はユーザージェスチャー内で同期実行
//   2. 生成直後に1サンプル無音バッファを鳴らしiOS Safariをアンロック
//   3. resume()のPromiseは捨てる(ジェスチャー境界を守るため)
//   4. 各音再生関数でもsuspended時にresume()を試みる
//   5. try-catchで例外を握りつぶし、非対応端末でも動作継続
//
// 拡張方法:
//   BGM追加 → Config.bgm に新エントリを追加してbgmKeyを指定
//   SE追加  → AudioEngine.sfx に新メソッドを追加
// ============================================================
const AudioEngine = (() => {
  // --- private state ---
  let ctx = null;
  let masterGain = null;
  let bgmGain = null;
  let seGain = null;
  let unlocked = false;
  let enabled = true;
  let bgmTimer = null;
  let bgmPat = null;
  let bgmStep = 0;
  let currentBgmKey = null;
  let dbgEl = null;
  let toneCount = 0;

  // --- debug display ---
  function log(msg) {
    if (dbgEl) dbgEl.textContent = `audio: ${msg} | tones:${toneCount}`;
  }

  // --- internal: 単音生成 ---
  function _tone(freq, dur, type = 'square', vol = 1, dest = null) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g);
      g.connect(dest || seGain);
      osc.start(t);
      osc.stop(t + dur + 0.05);
      toneCount++;
      log(`running`);
    } catch (e) {
      log(`tone err: ${e.message}`);
    }
  }

  // --- internal: ノイズ生成 ---
  function _noise(dur, vol = 0.3) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = vol;
      src.connect(g);
      g.connect(seGain);
      src.start();
    } catch (e) {}
  }

  // --- internal: BGMのtick ---
  function _tickBgm() {
    if (!bgmPat || !enabled || !unlocked) return;
    const N = Config.notes;
    const idx = bgmStep % bgmPat.len;
    const m = bgmPat.melody[idx];
    const b = bgmPat.bass[idx];
    const dur = bgmPat.tempo * 0.95;
    if (m && N[m]) _tone(N[m], dur, 'square', 1, bgmGain);
    if (b && N[b]) _tone(N[b], dur, 'triangle', 1, bgmGain);
    bgmStep++;
    bgmTimer = setTimeout(_tickBgm, bgmPat.tempo * 1000);
  }

  // --- public API ---
  return {
    setDebugEl(el) { dbgEl = el; log('not started'); },

    // ユーザージェスチャー内で同期呼び出しすること
    unlock() {
      if (unlocked) {
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { log('not supported'); return; }
      try {
        ctx = new AC();
        // iOS Safariアンロック: 無音1サンプルを即座に再生
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        if (ctx.state === 'suspended') {
          ctx.resume().then(
            () => log(`unlocked (${ctx.state})`),
            e  => log(`resume err: ${e.message}`)
          );
        }
        masterGain = ctx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.15; bgmGain.connect(masterGain);
        seGain  = ctx.createGain(); seGain.gain.value  = 0.5;  seGain.connect(masterGain);
        unlocked = true;
        log(`unlocked (${ctx.state})`);
      } catch (e) {
        log(`init err: ${e.message}`);
      }
    },

    startBgm(key) {
      if (!unlocked) return;
      this.stopBgm();
      currentBgmKey = key;
      if (!enabled) return;
      bgmPat = Config.bgm[key];
      if (!bgmPat) return;
      bgmStep = 0;
      _tickBgm();
    },

    stopBgm() {
      if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
      bgmPat = null;
    },

    setEnabled(v) {
      enabled = v;
      if (!enabled) this.stopBgm();
      else if (currentBgmKey) this.startBgm(currentBgmKey);
    },

    isEnabled: () => enabled,

    // --- 効果音 ---
    sfx: {
      jump() {
        if (!unlocked || !enabled || !ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        try {
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.type = 'square';
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.1);
          g.gain.setValueAtTime(0.3, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(g); g.connect(seGain); osc.start(t); osc.stop(t + 0.15);
        } catch (e) {}
      },
      coin() {
        const N = Config.notes;
        _tone(N.E5, 0.08, 'square', 0.5);
        setTimeout(() => _tone(N.G5, 0.15, 'square', 0.5), 70);
      },
      slide() { _noise(0.15, 0.15); },
      enemy() {
        if (!unlocked || !enabled || !ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        try {
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.type = 'square';
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.2);
          g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.connect(g); g.connect(seGain); osc.start(t); osc.stop(t + 0.25);
        } catch (e) {}
        _noise(0.1, 0.2);
      },
      goal() {
        const N = Config.notes;
        ['C5','E5','G5','C6'].forEach((k,i) => setTimeout(() => _tone(N[k], 0.25, 'square', 0.5), i * 100));
      },
      gameOver() {
        const N = Config.notes;
        ['G4','F4','E4','D4','C4'].forEach((k,i) => setTimeout(() => _tone(N[k], 0.2, 'triangle', 0.4), i * 120));
      },
    },
  };
})();

// ============================================================
// Input: 入力管理
// 拡張方法: callbacksに新しいハンドラを追加し、
//   対応するイベントをsetup内に追記する
// ============================================================
const Input = (() => {
  let cb = {};
  let startY = null;
  let swipeFired = false;
  // 現在のタッチジェスチャーがUI要素上で開始されたか
  // trueの間は preventDefault を一切呼ばない（クリックイベントを潰さないため）
  let gestureOnUI = false;

  function _start(y) {
    startY = y; swipeFired = false;
    cb.onJump && cb.onJump();
  }
  function _move(y) {
    if (startY === null) return;
    if (y - startY > Config.input.swipeThreshold && !swipeFired) {
      swipeFired = true;
      cb.onSlide && cb.onSlide();
    }
  }
  function _end() {
    startY = null;
    cb.onJumpRelease && cb.onJumpRelease();
  }

  // タッチ/クリックがUI要素（ボタン・モーダル・タイトル等）かを判定
  function _isUITarget(e) {
    let el = e.target;
    while (el && el !== document.body) {
      const cls = el.classList;
      if (el.tagName === 'BUTTON' ||
          (cls && (cls.contains('btn') || cls.contains('icon-btn') ||
                   cls.contains('title') || cls.contains('modal') || cls.contains('tutorial') ||
                   cls.contains('card') || cls.contains('tut-card')))) return true;
      el = el.parentElement;
    }
    return false;
  }

  return {
    setup(_canvasIgnored, callbacks) {
      cb = callbacks;
      // documentレベルでリッスン（レターボックスやiframe環境でも動作）

      // ---- Touch（iOS Safari / Android Chrome）----
      document.addEventListener('touchstart', e => {
        gestureOnUI = _isUITarget(e);
        if (gestureOnUI) return;                       // UI上ならpreventDefault禁止（click を残す）
        e.preventDefault();
        _start(e.touches[0].clientY);
      }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (gestureOnUI) return;
        e.preventDefault();
        _move(e.touches[0].clientY);
      }, { passive: false });

      document.addEventListener('touchend', e => {
        if (gestureOnUI) { gestureOnUI = false; return; }
        e.preventDefault();
        _end();
      }, { passive: false });

      document.addEventListener('touchcancel', e => {
        if (gestureOnUI) { gestureOnUI = false; return; }
        e.preventDefault();
        _end();
      }, { passive: false });

      // ---- Mouse（デスクトップ）----
      document.addEventListener('mousedown', e => {
        if (_isUITarget(e)) return;
        _start(e.clientY);
      });
      document.addEventListener('mousemove', e => {
        if (e.buttons === 1) _move(e.clientY);
      });
      document.addEventListener('mouseup', () => _end());

      // ---- Keyboard ----
      document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'ArrowUp')   { cb.onJump  && cb.onJump();  e.preventDefault(); }
        else if (e.code === 'ArrowDown')                  { cb.onSlide && cb.onSlide(); e.preventDefault(); }
      });
      document.addEventListener('keyup', e => {
        if (e.code === 'Space' || e.code === 'ArrowUp') cb.onJumpRelease && cb.onJumpRelease();
      });
    },
  };
})();

// ============================================================
// Player: プレイヤー状態
// 拡張方法: パラメータはすべてConfig.playerから読む。
//   新しいアクション追加はメソッドを追加してPhysicsから呼ぶ。
// ============================================================
class Player {
  constructor() {
    const pc = Config.player;
    this.x = 80; this.y = 0;
    this.w = pc.w; this.h = pc.h;
    this.vy = 0;
    this.grounded = true; this.jumping = false;
    this.sliding = false; this.slideTimer = 0;
    this.holdingJump = false; this.holdTimer = 0;
    this.animTime = 0;
    this.finishing = false;
  }
  tryJump() {
    if (!this.grounded || this.sliding) return false;
    this.vy = Config.player.jump;
    this.grounded = false; this.jumping = true;
    this.holdingJump = true; this.holdTimer = 0;
    return true;
  }
  releaseJump() { this.holdingJump = false; }
  trySlide() {
    if (!this.grounded || this.sliding) return false;
    this.sliding = true; this.slideTimer = 0;
    return true;
  }
  hitbox() {
    return { x:this.x, y:this.y, w:this.w, h:this.sliding ? 24 : this.h };
  }
}

// ============================================================
// Stage: ステージ状態
// 拡張方法: Config.stages[].objects に新しいtypeを追加し、
//   Stage.constructorのswitch分岐 & Physics/Rendererに対応追加
// ============================================================
class Stage {
  constructor(data) {
    this.data = data;
    this.platforms = [];
    this.coins     = [];
    this.enemies   = [];
    this.pits      = [];
    this.goal      = null;

    for (const obj of data.objects) {
      switch (obj.type) {
        case 'platform':
          this.platforms.push({ x:obj.x, y:obj.y, w:obj.w, h:obj.h });
          break;
        case 'coin':
          this.coins.push({ x:obj.x, y:obj.y, r:12, collected:false, anim:Math.random()*Math.PI*2 });
          break;
        case 'enemy':
          this.enemies.push(Stage._makeEnemy(obj));
          break;
        case 'pit':
          this.pits.push({ x:obj.x, w:obj.w });
          break;
        case 'goal':
          this.goal = { x:obj.x };
          break;
      }
    }
  }

  // 敵オブジェクト生成。新しい敵種類はここに追加する。
  static _makeEnemy(obj) {
    const base = { x:obj.x, y:0, alive:true, anim:0, kind:obj.kind };
    switch (obj.kind) {
      case 'bat':
        return { ...base, w:34, h:24, vx:-2.5, baseY:obj.floatY||120, amp:40, waveSpd:2.5 };
      case 'bird':
        return { ...base, w:38, h:26, vx:-4.5, baseY:obj.floatY||60,  amp:0,  waveSpd:0   };
      default: // slime
        return { ...base, w:36, h:30, vx:-2.2, baseY:0, amp:0, waveSpd:0 };
    }
  }
}

// ============================================================
// Physics: 移動・衝突判定
// 拡張方法: 新しい衝突対象はupdate内にfor...ofループを追加。
//   fx(エフェクトコールバック)で副作用を注入する設計。
// ============================================================
const Physics = {
  update(player, stage, dt, fx) {
    const pc = Config.player;

    // 長押しジャンプ
    if (player.holdingJump && player.jumping) {
      player.holdTimer += dt;
      if (player.holdTimer < pc.holdTime && player.vy > 0) player.vy += pc.holdForce;
    }

    // スライド持続
    if (player.sliding) {
      player.slideTimer += dt;
      if (player.slideTimer > pc.slideTime) player.sliding = false;
    }

    // 水平移動(オートラン)
    if (!player.finishing) {
      player.x += player.sliding ? pc.speed * pc.slideBoost : pc.speed;
    }

    // 重力・垂直移動
    player.vy -= pc.gravity;
    player.y  += player.vy;

    // プラットフォーム着地
    let onPlatform = false;
    if (player.vy <= 0) {
      for (const p of stage.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
          const top = p.y + p.h;
          if (player.y <= top && player.y >= top - 16 - Math.abs(player.vy)) {
            player.y = top; player.vy = 0;
            player.grounded = true; player.jumping = false;
            onPlatform = true;
            break;
          }
        }
      }
    }

    // 地面・落とし穴判定
    if (!onPlatform) {
      const cx = player.x + player.w / 2;
      const inPit = stage.pits.some(p => cx > p.x && cx < p.x + p.w);
      if (!inPit && player.y <= 0) {
        player.y = 0; player.vy = 0;
        player.grounded = true; player.jumping = false;
      } else {
        player.grounded = false;
      }
    }

    // 落下死亡
    if (player.y < -120) { fx.onDeath(); return; }

    // 敵の更新と衝突
    for (const e of stage.enemies) {
      if (!e.alive) continue;
      e.anim += dt;
      e.x    += e.vx;
      // 飛行敵のY座標更新(サイン波)
      if (e.kind === 'bat' || e.kind === 'bird') {
        e.y = e.baseY + Math.sin(e.anim * e.waveSpd) * e.amp;
      }

      if (!this._hitEnemy(player, e)) continue;

      if (e.kind === 'bat' || e.kind === 'bird') {
        // 飛行敵は踏めない・スライドも無効
        fx.onDeath(); return;
      } else if (player.vy < -3 && player.y + player.hitbox().h >= e.y + e.h - 10) {
        // 踏みつけ撃破
        e.alive = false; player.vy = pc.stomped;
        fx.onEnemyDefeat(e);
      } else if (player.sliding) {
        // スライド撃破
        e.alive = false;
        fx.onEnemyDefeat(e);
      } else {
        fx.onDeath(); return;
      }
    }

    // コイン取得
    for (const c of stage.coins) {
      if (c.collected) continue;
      c.anim += dt * 4;
      const dx = player.x + player.w / 2 - c.x;
      const dy = player.y + player.h / 2 - c.y;
      if (dx*dx + dy*dy < (c.r+18)*(c.r+18)) {
        c.collected = true;
        fx.onCoin(c);
      }
    }

    // ゴール到達
    if (stage.goal && !player.finishing && player.x + player.w / 2 >= stage.goal.x) {
      player.finishing = true;
      fx.onGoal();
    }

    player.animTime += dt;
  },

  _hitEnemy(player, e) {
    const hb = player.hitbox();
    return hb.x + hb.w > e.x && hb.x < e.x + e.w
        && hb.y < e.y + e.h && hb.y + hb.h > e.y;
  },
};

// ============================================================
// BgRenderer: 背景・地形描画
// 拡張方法: ステージのbgColorを変えるだけで背景色変更。
//   新しい背景要素はここに関数追加し、drawBg()内で呼ぶ。
// ============================================================
const BgRenderer = {
  _err: null,
  _trace(step, fn) {
    if (this._err) return;
    try { fn(); }
    catch (e) { this._err = `bg.${step}: ${e.message}`; const d=document.getElementById('dbg'); if (d){d.style.color='#FF6680';d.style.opacity='1';d.textContent=this._err.slice(0,220);} }
  },
  draw(ctx, stage, camera, VW, VH, groundY) {
    this._trace('sky',     () => this._sky(ctx, stage, VW, VH));
    this._trace('sun',     () => this._sun(ctx, VW));
    this._trace('clouds',  () => this._clouds(ctx, camera, VW));
    ctx.save();
    ctx.translate(-camera.x, 0);
    this._trace('hills',   () => this._hills(ctx, camera, groundY, VW));
    this._trace('ground',  () => this._ground(ctx, stage, camera, groundY, VH, VW));
    this._trace('platforms', () => this._platforms(ctx, stage, groundY));
    ctx.restore();
  },

  _sky(ctx, stage, VW, VH) {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    if (stage) {
      g.addColorStop(0, stage.data.bgColor[0]);
      g.addColorStop(1, stage.data.bgColor[1]);
    } else {
      g.addColorStop(0, '#87CEEB'); g.addColorStop(1, '#E8D5A3');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  },

  _sun(ctx, VW) {
    ctx.save();
    ctx.fillStyle = '#FFE066'; ctx.globalAlpha = 0.88;
    ctx.beginPath(); ctx.arc(VW - 80, 80, 34, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 3; ctx.globalAlpha = 0.35;
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(VW-80+Math.cos(a)*42, 80+Math.sin(a)*42);
      ctx.lineTo(VW-80+Math.cos(a)*58, 80+Math.sin(a)*58);
      ctx.stroke();
    }
    ctx.restore();
  },

  _clouds(ctx, camera, VW) {
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    const o = (camera.x * 0.15) % (VW + 200);
    [[VW*.2-o,100],[VW*.6-o*.7,70],[VW-o*.4,130],[VW*1.4-o,90]].forEach(([x,y]) => {
      ctx.beginPath();
      ctx.arc(x,y,24,0,Math.PI*2); ctx.arc(x+20,y-6,22,0,Math.PI*2); ctx.arc(x+40,y,20,0,Math.PI*2);
      ctx.fill();
    });
  },

  _hills(ctx, camera, groundY, VW) {
    ctx.fillStyle = 'rgba(100,180,80,.38)';
    const off = camera.x * 0.25;
    for (let i = -1; i < 8; i++) {
      const x = camera.x + i*300 - (off%300);
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.bezierCurveTo(x+60, groundY-110, x+180, groundY-110, x+300, groundY);
      ctx.closePath(); ctx.fill();
    }
  },

  _ground(ctx, stage, camera, groundY, VH, VW) {
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(camera.x, groundY, VW, VH - groundY);
    ctx.fillStyle = '#7CBA3D';
    ctx.fillRect(camera.x, groundY, VW, 11);
    // 落とし穴
    ctx.fillStyle = '#0B0F1E';
    for (const pit of stage.pits) ctx.fillRect(pit.x, groundY, pit.w, VH-groundY);
    // 草のディテール
    ctx.fillStyle = '#5DAA2E';
    for (let x = Math.floor(camera.x/30)*30; x < camera.x+VW; x += 30) {
      if (!stage.pits.some(p => x > p.x-10 && x < p.x+p.w+10)) {
        ctx.fillRect(x, groundY-4, 4, 8);
        ctx.fillRect(x+8, groundY-3, 3, 6);
      }
    }
  },

  _platforms(ctx, stage, groundY) {
    for (const p of stage.platforms) {
      const y = groundY - p.y - p.h;
      ctx.fillStyle = '#8B5A2B'; ctx.fillRect(p.x, y, p.w, p.h);
      ctx.fillStyle = '#7CBA3D'; ctx.fillRect(p.x, y, p.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      for (let i = 0; i < p.w; i += 20) ctx.fillRect(p.x+i, y+6, 1, p.h-6);
    }
  },
};

// ============================================================
// CharRenderer: ここちゃん(プレイヤー)描画 - かわいいデザイン
// ============================================================
const CharRenderer = {
  draw(ctx, player, groundY) {
    const sy = groundY - player.y - player.h;
    const cx = player.x + player.w / 2;
    const cy = sy + player.h / 2;

    // 影
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.globalAlpha = Math.max(0.08, 0.38 - Math.abs(player.vy) * 0.02);
    ctx.beginPath();
    ctx.ellipse(cx, groundY - 2, player.sliding ? 28 : 20, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (player.sliding) { this._sliding(ctx, cx, groundY - 18); return; }

    const frame = Math.floor(player.animTime * 12) % 4;
    const bob = player.grounded ? Math.sin(player.animTime * 10) * 2 : 0;

    ctx.save();
    ctx.translate(cx, cy + bob);
    this._tail(ctx, player);
    this._backLegs(ctx, player, frame);
    this._body(ctx);
    this._frontLegs(ctx, player, frame);
    this._head(ctx);
    ctx.restore();
  },

  _body(ctx) {
    // 体（グレー）
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(0, 7, 16, 13, 0, 0, Math.PI*2); ctx.fill();
    // お腹（淡いグレー）
    ctx.fillStyle = '#C8D5DC';
    ctx.beginPath(); ctx.ellipse(0, 11, 10, 8, 0, 0, Math.PI*2); ctx.fill();
  },

  _head(ctx) {
    const hy = -14;
    // 耳（グレー）
    ctx.fillStyle = '#7A8B98';
    ctx.beginPath(); ctx.moveTo(-18,hy-2); ctx.lineTo(-23,hy-22); ctx.lineTo(-7,hy-10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 18,hy-2); ctx.lineTo( 23,hy-22); ctx.lineTo( 7,hy-10); ctx.closePath(); ctx.fill();
    // 耳の内側（ピンク）
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(-16,hy-4); ctx.lineTo(-19,hy-17); ctx.lineTo(-9,hy-10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 16,hy-4); ctx.lineTo( 19,hy-17); ctx.lineTo( 9,hy-10); ctx.closePath(); ctx.fill();
    // 顔（大きくて丸い）
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(0, hy, 21, 20, 0, 0, Math.PI*2); ctx.fill();
    // ほっぺ（白みがかり）
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.ellipse(-9, hy+4, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 9, hy+4, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    // 白目（大きなアニメ目）
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(-8, hy-2, 7, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-2, 7, 8, 0, 0, Math.PI*2); ctx.fill();
    // 虹彩（金色）
    ctx.fillStyle = '#D4A200';
    ctx.beginPath(); ctx.ellipse(-8, hy-1, 5.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-1, 5.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    // 瞳孔（縦長スリット）
    ctx.fillStyle = '#0A0F1E';
    ctx.beginPath(); ctx.ellipse(-8, hy-1, 2, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-1, 2, 5.5, 0, 0, Math.PI*2); ctx.fill();
    // ハイライト（2段）
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(-9.5, hy-4.5, 2,   0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(  6.5, hy-4.5, 2,   0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( -6.5, hy+1.5, 1,   0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(  9.5, hy+1.5, 1,   0, Math.PI*2); ctx.fill();
    // 鼻（ピンク三角）
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(-3,hy+5); ctx.lineTo(3,hy+5); ctx.lineTo(0,hy+9); ctx.closePath(); ctx.fill();
    // 口（にっこり）
    ctx.strokeStyle = '#4A5566'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,hy+9); ctx.quadraticCurveTo(-4,hy+13,-6.5,hy+11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,hy+9); ctx.quadraticCurveTo( 4,hy+13, 6.5,hy+11); ctx.stroke();
    // ヒゲ（3本ずつ）
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(-9,hy+7);  ctx.lineTo(-22,hy+5);
    ctx.moveTo(-9,hy+9);  ctx.lineTo(-22,hy+9);
    ctx.moveTo(-9,hy+11); ctx.lineTo(-20,hy+13);
    ctx.moveTo( 9,hy+7);  ctx.lineTo( 22,hy+5);
    ctx.moveTo( 9,hy+9);  ctx.lineTo( 22,hy+9);
    ctx.moveTo( 9,hy+11); ctx.lineTo( 20,hy+13);
    ctx.stroke();
  },

  _tail(ctx, player) {
    const wag = Math.sin(player.animTime * 9) * 11;
    // 尻尾本体
    ctx.strokeStyle = '#7A8B98'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, 5);
    ctx.quadraticCurveTo(-30, -4+wag, -28, -20+wag);
    ctx.stroke();
    // 白い先っぽ
    ctx.strokeStyle = '#D0DCE4'; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-27, -18+wag);
    ctx.quadraticCurveTo(-30, -25+wag, -27, -28+wag);
    ctx.stroke();
  },

  _frontLegs(ctx, player, frame) {
    ctx.fillStyle = '#8A9BAA';
    if (player.grounded && !player.jumping) {
      const offs = [[-9,0],[-7,-2],[-11,0],[-9,-2]];
      const o = offs[frame];
      ctx.beginPath(); ctx.ellipse(o[0],   21+o[1], 5, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o[0]+5, 21-o[1], 5, 8, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-7, 16, 5, 8, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-1, 16, 5, 8, -0.3, 0, Math.PI*2); ctx.fill();
    }
  },

  _backLegs(ctx, player, frame) {
    ctx.fillStyle = '#7A8B98';
    if (player.grounded && !player.jumping) {
      const offs = [[10,-2],[12,0],[8,-2],[10,0]];
      const o = offs[frame];
      ctx.beginPath(); ctx.ellipse(o[0], 21+o[1], 6, 9, 0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(12, 15, 6, 9, 0.3, 0, Math.PI*2); ctx.fill();
    }
  },

  _sliding(ctx, cx, y) {
    ctx.save(); ctx.translate(cx, y);
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(0, 20, 30, 5, 0, 0, Math.PI*2); ctx.fill();
    // 尻尾
    ctx.strokeStyle = '#7A8B98'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-22, 3); ctx.lineTo(-33, -2); ctx.stroke();
    ctx.strokeStyle = '#D0DCE4'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-32, -1); ctx.lineTo(-38, -5); ctx.stroke();
    // 体（横長）
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(0, 5, 28, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C8D5DC';
    ctx.beginPath(); ctx.ellipse(0, 8, 18, 8, 0, 0, Math.PI*2); ctx.fill();
    // 頭（横向き）
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(22, -1, 17, 15, 0, 0, Math.PI*2); ctx.fill();
    // 耳
    ctx.fillStyle = '#7A8B98';
    ctx.beginPath(); ctx.moveTo(14,-10); ctx.lineTo(10,-22); ctx.lineTo(20,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24,-12); ctx.lineTo(28,-23); ctx.lineTo(32,-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(15,-11); ctx.lineTo(13,-18); ctx.lineTo(19,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(25,-13); ctx.lineTo(27,-19); ctx.lineTo(30,-11); ctx.closePath(); ctx.fill();
    // 目（細め・スピード顔）
    ctx.strokeStyle = '#0A0F1E'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(15,-3); ctx.quadraticCurveTo(18,-6,21,-3);
    ctx.moveTo(24,-3); ctx.quadraticCurveTo(27,-6,30,-3);
    ctx.stroke();
    // 速度線
    ctx.strokeStyle = '#3DDCFF'; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-40-i*8, -4+i*5); ctx.lineTo(-24-i*8, -4+i*5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },
};

// ============================================================
// EnemyRenderer: 敵3種の描画
// 拡張方法: 新しい敵種類はswitch/caseを追加し専用関数を書く。
// ============================================================
const EnemyRenderer = {
  draw(ctx, e, groundY) {
    if (!e.alive) return;
    switch (e.kind) {
      case 'bat':   this._bat(ctx, e, groundY);   break;
      case 'bird':  this._bird(ctx, e, groundY);  break;
      default:      this._slime(ctx, e, groundY); break;
    }
  },

  _slime(ctx, e, groundY) {
    const y = groundY - e.h;
    const sq = Math.sin(e.anim*5)*0.1;
    ctx.save(); ctx.translate(e.x+e.w/2, y+e.h);
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,4,18,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9c27b0'; ctx.beginPath(); ctx.ellipse(0,-e.h/2,e.w/2,e.h/2+sq*5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(-6,-e.h/2-4,4,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },

  _bat(ctx, e, groundY) {
    const sy = groundY - e.y - e.h;
    const flap = Math.sin(e.anim*12)*0.4;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    // 翼
    ctx.fillStyle='#5c2a8a';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*22,-8+flap*18,dir*30,4+flap*10);
      ctx.quadraticCurveTo(dir*18,8,0,4); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    // 体
    ctx.fillStyle='#7b3fad'; ctx.beginPath(); ctx.ellipse(0,2,10,10,0,0,Math.PI*2); ctx.fill();
    // 耳
    ctx.fillStyle='#5c2a8a';
    ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(-8,-14); ctx.lineTo(-2,-8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,-6); ctx.lineTo(8,-14); ctx.lineTo(2,-8); ctx.closePath(); ctx.fill();
    // 目(赤く光る)
    ctx.fillStyle='#FF4D6D'; ctx.beginPath(); ctx.arc(-4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },

  _bird(ctx, e, groundY) {
    const sy = groundY - e.y - e.h;
    const flap = Math.sin(e.anim*16)*0.5;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    // 翼
    ctx.fillStyle='#FF8C00';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*15,-10+flap*14,dir*26,-2+flap*8);
      ctx.quadraticCurveTo(dir*12,6,0,2); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    // 体
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,1,11,9,0,0,Math.PI*2); ctx.fill();
    // くちばし
    ctx.fillStyle='#FF6B00'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-18,-2); ctx.lineTo(-10,4); ctx.closePath(); ctx.fill();
    // 目
    ctx.fillStyle='#0B0F2A'; ctx.beginPath(); ctx.arc(-4,-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-3,1,0,Math.PI*2); ctx.fill();
    // 速度線
    ctx.strokeStyle='#FFD23F'; ctx.lineWidth=1.5; ctx.globalAlpha=0.5;
    for (let i=1;i<=3;i++) { ctx.beginPath(); ctx.moveTo(8+i*7,-3+i*2); ctx.lineTo(16+i*7,-3+i*2); ctx.stroke(); }
    ctx.globalAlpha=1;
    ctx.restore();
  },
};

// ============================================================
// NaruRenderer: なるちゃん(ゴール)描画 - かわいいデザイン
// ============================================================
const NaruRenderer = {
  draw(ctx, goal, groundY) {
    const t   = performance.now() * 0.001;
    const bell = Math.sin(t * 3.2) * 3;
    const wag  = Math.sin(t * 4.1) * 12;
    ctx.save();
    ctx.translate(goal.x + 32, groundY - 8);

    // 影
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(0, 0, 32, 7, 0, 0, Math.PI*2); ctx.fill();

    // しっぽ（太くてふわふわ）
    ctx.strokeStyle = '#D4894A'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(26,-30); ctx.quadraticCurveTo(52,-48+wag, 48,-70+wag); ctx.stroke();
    ctx.strokeStyle = '#F5C890'; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(47,-68+wag); ctx.quadraticCurveTo(52,-78+wag, 48,-82+wag); ctx.stroke();

    // 後ろ足
    ctx.fillStyle = '#D4894A';
    ctx.beginPath(); ctx.ellipse(-15,-6, 10, 7,  0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 15,-6, 10, 7, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F0EAE0';
    ctx.beginPath(); ctx.ellipse(17,-5, 8, 5, -0.2, 0, Math.PI*2); ctx.fill();

    // 体（オレンジ）
    ctx.fillStyle = '#E8975A';
    ctx.beginPath(); ctx.ellipse(0,-40, 26, 24, 0, 0, Math.PI*2); ctx.fill();
    // お腹（クリーム）
    ctx.fillStyle = '#F5EEE4';
    ctx.beginPath(); ctx.ellipse(-2,-36, 17, 15, 0, 0, Math.PI*2); ctx.fill();
    // 縞模様
    ctx.strokeStyle = 'rgba(170,90,20,.3)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14,-52); ctx.lineTo(-16,-46);
    ctx.moveTo( -7,-54); ctx.lineTo( -9,-48);
    ctx.moveTo( 14,-52); ctx.lineTo( 16,-46);
    ctx.stroke();

    // 前足
    ctx.fillStyle = '#E8975A';
    ctx.beginPath(); ctx.ellipse(-11,-17, 7,11, -0.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 11,-17, 7,11,  0.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F5EEE4';
    ctx.beginPath(); ctx.ellipse(12,-15, 5, 8, 0.1, 0, Math.PI*2); ctx.fill();

    // 首輪（赤）
    ctx.fillStyle = '#DC3535';
    ctx.fillRect(-17,-62, 34, 9);
    ctx.fillStyle = 'rgba(255,200,200,.55)';
    [-8,0,8].forEach(x => { ctx.beginPath(); ctx.arc(x,-58, 1.8, 0, Math.PI*2); ctx.fill(); });

    // 鈴（ゆれる）
    const by = -52 + bell * 0.4;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(0, by, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#B8860B';
    ctx.fillRect(-1, by+3, 2, 4);

    // 頭
    const hy = -84;
    // 耳（オレンジ）
    ctx.fillStyle = '#D4894A';
    ctx.beginPath(); ctx.moveTo(-16,hy); ctx.lineTo(-21,hy-22); ctx.lineTo(-5,hy-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 16,hy); ctx.lineTo( 21,hy-22); ctx.lineTo( 5,hy-12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(-14,hy-2); ctx.lineTo(-17,hy-16); ctx.lineTo(-7,hy-11); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 14,hy-2); ctx.lineTo( 17,hy-16); ctx.lineTo( 7,hy-11); ctx.closePath(); ctx.fill();
    // 顔（クリームオレンジ）
    ctx.fillStyle = '#F0D0A0';
    ctx.beginPath(); ctx.ellipse(0, hy, 22, 21, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F5EEE4';
    ctx.beginPath(); ctx.ellipse(-8, hy+2, 11, 9, 0, 0, Math.PI*2); ctx.fill();
    // 額の縞
    ctx.strokeStyle = 'rgba(170,90,20,.28)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6,hy-14); ctx.lineTo(-5,hy-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 0,hy-15); ctx.lineTo( 0,hy-9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 6,hy-14); ctx.lineTo( 5,hy-8); ctx.stroke();
    // 目（うれしくて細め・弧）
    ctx.strokeStyle = '#5A3010'; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13,hy-2); ctx.quadraticCurveTo(-8,hy-8,-4,hy-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(  4,hy-2); ctx.quadraticCurveTo( 8,hy-8,12,hy-2); ctx.stroke();
    // まつ毛
    ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14,hy-3); ctx.lineTo(-15,hy-7);
    ctx.moveTo( -4,hy-4); ctx.lineTo( -3,hy-8);
    ctx.moveTo(  4,hy-4); ctx.lineTo(  3,hy-8);
    ctx.moveTo( 14,hy-3); ctx.lineTo( 15,hy-7);
    ctx.stroke();
    // ほっぺ（赤らめ）
    ctx.fillStyle = 'rgba(255,150,100,.35)';
    ctx.beginPath(); ctx.ellipse(-11,hy+5, 7, 4.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 11,hy+5, 7, 4.5, 0, 0, Math.PI*2); ctx.fill();
    // 鼻
    ctx.fillStyle = '#FF9EB0';
    ctx.beginPath(); ctx.moveTo(-3,hy+5); ctx.lineTo(3,hy+5); ctx.lineTo(0,hy+9); ctx.closePath(); ctx.fill();
    // 口（にこにこ）
    ctx.strokeStyle = '#7A4020'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,hy+9); ctx.quadraticCurveTo(-5,hy+14,-7,hy+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,hy+9); ctx.quadraticCurveTo( 5,hy+14, 7,hy+12); ctx.stroke();
    // ヒゲ
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(-8,hy+7); ctx.lineTo(-21,hy+5);
    ctx.moveTo(-8,hy+9); ctx.lineTo(-21,hy+9);
    ctx.moveTo( 8,hy+7); ctx.lineTo( 21,hy+5);
    ctx.moveTo( 8,hy+9); ctx.lineTo( 21,hy+9);
    ctx.stroke();

    // 吹き出し（角丸）
    const bx=8, bsy=hy-46, bw=60, bsh=28, br=8;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(bx+br,bsy); ctx.lineTo(bx+bw-br,bsy); ctx.arcTo(bx+bw,bsy,bx+bw,bsy+br,br);
    ctx.lineTo(bx+bw,bsy+bsh-br); ctx.arcTo(bx+bw,bsy+bsh,bx+bw-br,bsy+bsh,br);
    ctx.lineTo(bx+br,bsy+bsh); ctx.arcTo(bx,bsy+bsh,bx,bsy+bsh-br,br);
    ctx.lineTo(bx,bsy+br); ctx.arcTo(bx,bsy,bx+br,bsy,br);
    ctx.closePath(); ctx.fill();
    // 吹き出しの三角
    ctx.fillStyle = '#DC3535';
    ctx.beginPath(); ctx.moveTo(bx+10,bsy+bsh); ctx.lineTo(bx+6,bsy+bsh+12); ctx.lineTo(bx+20,bsy+bsh); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('にゃ〜！', bx+bw/2, bsy+18);

    ctx.restore();
  },
};

// ============================================================
// Renderer: 統合描画コーディネーター
// 各サブRendererを呼び出す。カメラ制御・パーティクルもここ。
// ============================================================
const Renderer = (() => {
  let canvas, ctx;
  let _lastCw = 0, _lastCh = 0;

  // ビューポートサイズを取得（iframe内でinnerWidthが嘘をつくケースに対応）
  // visualViewportが最も正確。なければinnerWidth/Heightとscreenの小さい方を使う
  function _getViewport() {
    const vv = window.visualViewport;
    if (vv && vv.width && vv.height) return { w: vv.width, h: vv.height };
    const w = Math.min(window.innerWidth || 0, screen.width || Infinity);
    const h = Math.min(window.innerHeight || 0, screen.height || Infinity);
    return { w: w || window.innerWidth || 360, h: h || window.innerHeight || 640 };
  }

  function _resize() {
    const dpr = window.devicePixelRatio||1;
    const { w, h } = _getViewport();
    const aspect = Config.VW / Config.VH;
    let cw, ch;
    if (w/h > aspect) { ch=h; cw=h*aspect; } else { cw=w; ch=w/aspect; }
    // サイズが変わってない場合はスキップ（毎フレーム呼ばれても軽い）
    if (Math.abs(cw - _lastCw) < 0.5 && Math.abs(ch - _lastCh) < 0.5) return;
    _lastCw = cw; _lastCh = ch;
    canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
    canvas.width = cw*dpr; canvas.height = ch*dpr;
    ctx.setTransform((cw/Config.VW)*dpr, 0, 0, (cw/Config.VW)*dpr, 0, 0);
  }

  return {
    init(canvasEl) {
      canvas = canvasEl; ctx = canvas.getContext('2d');
      _resize();
      window.addEventListener('resize', _resize);
      window.addEventListener('orientationchange', _resize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', _resize);
        window.visualViewport.addEventListener('scroll', _resize);
      }
    },

    // 毎フレーム呼ぶ：iframe内でinnerWidthが遅れて正しい値になるケースに備える
    syncSize() { _resize(); },

    draw(state) {
      const { stage, camera, player, particles } = state;
      const { VW, VH, GROUND_Y } = Config;

      BgRenderer.draw(ctx, stage, camera, VW, VH, GROUND_Y);
      if (!stage) return;

      ctx.save();
      ctx.translate(-camera.x, 0);

      // コイン
      for (const c of stage.coins) {
        if (c.collected) continue;
        const y = GROUND_Y - c.y;
        const wob = Math.sin(c.anim)*3;
        ctx.save(); ctx.translate(c.x, y+wob);
        ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,13,9,3,0,0,Math.PI*2); ctx.fill();
        const g=ctx.createRadialGradient(-2,-2,1,0,0,11);
        g.addColorStop(0,'#FFE57F'); g.addColorStop(1,'#FFB300');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#8B6914'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.fillStyle='#FFF'; ctx.fillRect(-1,-5,2,10);
        ctx.restore();
      }

      // 敵
      for (const e of stage.enemies) EnemyRenderer.draw(ctx, e, GROUND_Y);

      // ゴール(なるちゃん)
      if (stage.goal) NaruRenderer.draw(ctx, stage.goal, GROUND_Y);

      // プレイヤー(ここちゃん)
      if (player) CharRenderer.draw(ctx, player, GROUND_Y);

      // パーティクル
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life*2);
        ctx.fillRect(p.x-p.size/2, GROUND_Y-p.y-p.size/2, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    },
  };
})();

// ============================================================
// UI: DOM操作・ストーリー表示
// 拡張方法: 新しいモーダルはHTMLに追加し、
//   UIのon()/showModal()/hideModal()で操作する。
// ============================================================
const UI = (() => {
  const $ = id => document.getElementById(id);
  const ids = [
    'titleScreen','hud','tutorial','storyModal','resultModal','gameOverModal','pauseModal',
    'stageLabel','coinCount','timer','resultStars','resultScore','resultTime','resultCoins',
    'nextBtn','soundBtn','storyIcon','storyTitle','storyText','storyNext',
  ];
  const el = {};

  return {
    init() { ids.forEach(id => el[id] = $(id)); },
    show:      id => { el[id].style.display = 'flex'; },
    hide:      id => { el[id].style.display = 'none'; },
    showModal: id => el[id].classList.add('show'),
    hideModal: id => el[id].classList.remove('show'),
    on:        (id, fn) => $(id).addEventListener('click', fn),

    setStage:  id   => { el.stageLabel.textContent = `STAGE ${id}`; },
    setCoins:  n    => { el.coinCount.textContent = `🔔 ${n}`; },
    setTimer:  secs => {
      const m = Math.floor(secs/60).toString().padStart(2,'0');
      const s = Math.floor(secs%60).toString().padStart(2,'0');
      el.timer.textContent = `${m}:${s}`;
    },
    setSoundIcon: on => {
      el.soundBtn.textContent = on ? '🔊' : '🔇';
      el.soundBtn.classList.toggle('off', !on);
    },

    // ストーリーモーダルを表示し、閉じたらcb()を呼ぶ
    showStory(story, cb) {
      el.storyIcon.textContent  = story.icon;
      el.storyTitle.textContent = story.title;
      el.storyText.textContent  = story.text;
      el.storyNext.onclick = () => { this.hideModal('storyModal'); cb(); };
      this.showModal('storyModal');
    },

    showResult(stars, score, secs, coins, hasNext) {
      el.resultStars.textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
      el.resultScore.textContent = score;
      const m = Math.floor(secs/60).toString().padStart(2,'0');
      const s = Math.floor(secs%60).toString().padStart(2,'0');
      el.resultTime.textContent = `${m}:${s}`;
      el.resultCoins.textContent = coins;
      el.nextBtn.style.display = hasNext ? 'block' : 'none';
      this.showModal('resultModal');
    },
  };
})();

// ============================================================
// Game: ゲーム状態と進行管理
// 拡張方法:
//   新ステージ → Config.stagesに追加するだけ
//   新ゲーム状態 → STATEに追加し、updateでハンドル
// ============================================================
const STATE = { TITLE:'title', PLAYING:'playing', PAUSED:'paused', RESULT:'result', GAMEOVER:'gameover' };

const Game = (() => {
  // --- ゲームの状態オブジェクト ---
  // Rendererがこれを参照して描画する
  const state = {
    mode:      STATE.TITLE,
    stageIdx:  0,
    stage:     null,
    player:    null,
    camera:    { x:0 },
    coins:     0,
    timer:     0,
    particles: [],
    shownTutorial: false,
  };

  function _addParticles(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random()-.5)*6,
        vy: Math.random()*5+2,
        life: 0.5+Math.random()*0.3,
        color, size: 3+Math.random()*2,
      });
    }
  }

  function _loadStage(idx) {
    state.stageIdx  = idx;
    state.stage     = new Stage(Config.stages[idx]);
    state.player    = new Player();
    state.camera.x  = 0;
    state.coins     = 0;
    state.timer     = 0;
    state.particles = [];
    UI.setStage(state.stage.data.id);
    UI.show('hud');
    AudioEngine.startBgm(state.stage.data.bgmKey);
  }

  // Physics に渡すエフェクトコールバック群
  const _fx = {
    onCoin(c) {
      state.coins++;
      _addParticles(c.x, c.y, 6, '#FFD23F');
      AudioEngine.sfx.coin();
    },
    onEnemyDefeat(e) {
      _addParticles(e.x+e.w/2, e.y+e.h/2, 8, '#FF4D6D');
      AudioEngine.sfx.enemy();
    },
    onGoal()  { _stageClear(); },
    onDeath() { _gameOver(); },
  };

  // Input に渡すコールバック群
  const _inputCb = {
    onJump() {
      if (state.mode !== STATE.PLAYING) return;
      if (state.player.tryJump()) {
        _addParticles(state.player.x+state.player.w/2, state.player.y, 6, '#FFD23F');
        AudioEngine.sfx.jump();
      }
    },
    onJumpRelease() { if (state.player) state.player.releaseJump(); },
    onSlide() {
      if (state.mode !== STATE.PLAYING) return;
      if (state.player.trySlide()) {
        _addParticles(state.player.x+state.player.w/2, state.player.y+4, 4, '#3DDCFF');
        AudioEngine.sfx.slide();
      }
    },
  };

  function _stageClear() {
    state.mode = STATE.RESULT;
    AudioEngine.stopBgm();
    AudioEngine.sfx.goal();

    const sc = Config.score;
    const timeBonus = Math.max(0, Math.floor((sc.timeBonusCap - state.timer) * sc.timeBonus));
    const score = state.coins * sc.coinVal + timeBonus + sc.clearBonus;
    const stars = score >= sc.star3 ? 3 : score >= sc.star2 ? 2 : 1;
    const hasNext = state.stageIdx < Config.stages.length - 1;

    setTimeout(() => {
      // 次ステージのストーリーがあれば表示してからリザルトへ
      const nextData = Config.stages[state.stageIdx + 1];
      if (hasNext && nextData && nextData.story) {
        UI.showStory(nextData.story, () => UI.showResult(stars, score, state.timer, state.coins, hasNext));
      } else {
        UI.showResult(stars, score, state.timer, state.coins, hasNext);
      }
    }, 800);
  }

  function _gameOver() {
    state.mode = STATE.GAMEOVER;
    AudioEngine.stopBgm();
    AudioEngine.sfx.gameOver();
    UI.showModal('gameOverModal');
  }

  // --- public API ---
  return {
    state,       // Rendererから参照
    inputCb: _inputCb,

    start() {
      _loadStage(0);
      if (!state.shownTutorial) {
        UI.show('tutorial');
        state.mode = STATE.TITLE;
      } else {
        state.mode = STATE.PLAYING;
      }
    },

    dismissTutorial() {
      if (state.mode === STATE.PLAYING) return;
      UI.hide('tutorial');
      state.shownTutorial = true;
      state.mode = STATE.PLAYING;
    },

    pause() {
      if (state.mode !== STATE.PLAYING) return;
      state.mode = STATE.PAUSED;
      AudioEngine.stopBgm();
      UI.showModal('pauseModal');
    },

    resume() {
      if (state.mode !== STATE.PAUSED) return;
      UI.hideModal('pauseModal');
      state.mode = STATE.PLAYING;
      AudioEngine.startBgm(state.stage.data.bgmKey);
    },

    retry() {
      ['pauseModal','gameOverModal','resultModal'].forEach(id => UI.hideModal(id));
      _loadStage(state.stageIdx);
      state.mode = STATE.PLAYING;
    },

    nextStage() {
      UI.hideModal('resultModal');
      if (state.stageIdx < Config.stages.length - 1) {
        _loadStage(state.stageIdx + 1);
        state.mode = STATE.PLAYING;
      } else {
        this.backToTitle();
      }
    },

    backToTitle() {
      ['resultModal','gameOverModal','pauseModal'].forEach(id => UI.hideModal(id));
      UI.hide('hud');
      UI.show('titleScreen');
      state.mode = STATE.TITLE;
      AudioEngine.startBgm('title');
    },

    update(dt) {
      if (state.mode !== STATE.PLAYING) return;

      state.timer += dt;
      Physics.update(state.player, state.stage, dt, _fx);

      // カメラ追従(プレイヤーを画面30%の位置に保つ)
      const tx = state.player.x - Config.VW * 0.30;
      state.camera.x += (tx - state.camera.x) * 0.15;
      const stageLen = state.stage.data.objects.reduce((max, o) => Math.max(max, o.x || 0), 0) + 400;
      state.camera.x = Math.max(0, Math.min(state.camera.x, stageLen - Config.VW));

      // パーティクル更新
      for (let i = state.particles.length-1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy -= 0.3; p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      UI.setCoins(state.coins);
      UI.setTimer(state.timer);
    },
  };
})();

// ============================================================
// Main: エントリーポイント
// UI イベントの登録・起動・メインループの管理のみ。
// 新しいUI要素のイベントはここに追加する。
// ============================================================
(function main() {
  UI.init();
  Renderer.init(document.getElementById('game'));
  AudioEngine.setDebugEl(document.getElementById('dbg'));
  Input.setup(document.getElementById('game'), Game.inputCb);

  // タイトルタップ: AudioContextアンロック → オープニング → ゲーム開始
  let _titleFired = false;
  function _startFromTitle() {
    if (_titleFired) return;
    _titleFired = true;
    AudioEngine.unlock();
    AudioEngine.sfx.coin();
    UI.hide('titleScreen');
    const opening = Config.stages[0].story;
    UI.showStory(opening, () => Game.start());
  }
  UI.on('titleScreen', _startFromTitle);
  document.getElementById('titleScreen').addEventListener('touchstart', e => {
    e.stopPropagation();
    _startFromTitle();
  }, { passive: true });

  // チュートリアル（iOS Safari のclick遅延対策でtouchstartも登録）
  UI.on('tutorial', () => Game.dismissTutorial());
  document.getElementById('tutorial').addEventListener('touchstart', e => {
    e.preventDefault();
    Game.dismissTutorial();
  }, { passive: false });

  // HUD
  UI.on('pauseBtn', () => Game.pause());
  UI.on('soundBtn', () => {
    AudioEngine.unlock();
    const next = !AudioEngine.isEnabled();
    AudioEngine.setEnabled(next);
    UI.setSoundIcon(next);
    if (next) AudioEngine.sfx.coin();
  });

  // ポーズ
  UI.on('resumeBtn',    () => Game.resume());
  UI.on('pauseRetryBtn',() => Game.retry());
  UI.on('pauseTitleBtn',() => Game.backToTitle());

  // リザルト
  UI.on('nextBtn',  () => Game.nextStage());
  UI.on('retryBtn', () => Game.retry());

  // ゲームオーバー
  UI.on('overRetryBtn', () => Game.retry());
  UI.on('overTitleBtn', () => Game.backToTitle());

  // ===== デバッグ表示（独立要素・上書きされない） =====
  const dbg2El = document.getElementById('dbg2');
  let _lastErr = '';
  function _showError(label, err) {
    if (!dbg2El) return;
    const msg = (err && err.message) ? err.message : String(err);
    const stack = (err && err.stack) ? String(err.stack).split('\n')[1] || '' : '';
    _lastErr = `ERR[${label}] ${msg} | ${stack}`.slice(0, 240);
    dbg2El.style.color = '#FF6680';
  }
  window.addEventListener('error', e => _showError('win', e.error || e.message));
  window.addEventListener('unhandledrejection', e => _showError('prm', e.reason));

  function _updateDbg2() {
    if (!dbg2El) return;
    if (_lastErr) { dbg2El.textContent = _lastErr; return; }
    const canvas = document.getElementById('game');
    const s = Game.state || {};
    const p = s.player || {};
    const c = s.camera || {};
    dbg2El.textContent =
      `win=${innerWidth}x${innerHeight} dpr=${devicePixelRatio} ` +
      `cv=${canvas.width}x${canvas.height}(${canvas.style.width}x${canvas.style.height}) ` +
      `mode=${s.mode} px=${p.x|0} py=${p.y|0} g=${p.grounded?1:0} cx=${c.x|0}`;
  }

  // メインループ(60fps固定、最大フレーム時間は33ms)
  let lastTime = performance.now();
  let _errReported = false;
  let _frameCount = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    // iframe内でinnerWidthが後から正しい値になるケースに備えて毎フレームサイズ同期
    try { Renderer.syncSize && Renderer.syncSize(); } catch(_){}
    try { Game.update(dt); }
    catch (e) { if (!_errReported) { _showError('update', e); _errReported = true; } }
    try { Renderer.draw(Game.state); }
    catch (e) { if (!_errReported) { _showError('draw', e); _errReported = true; } }
    if ((_frameCount++ & 15) === 0) _updateDbg2();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
