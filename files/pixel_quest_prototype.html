<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ここちゃんとなるちゃんの冒険</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2040">

<style>
/* =========================================================
 * 基本設計
 *   - ゲーム空間は 480x800 で固定
 *   - キャンバスは CSS の aspect-ratio で常に 480:800 を維持
 *     しつつ、ビューポートに合うサイズで letterbox 表示
 *   - JS は resize の計算を一切持たない（iframe 内で innerWidth
 *     が嘘をついてもブラウザ任せで安定する）
 * ========================================================= */

*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#1a2040;color:#F4F6FF;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  touch-action:none;
}

#app{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* キャンバス: 480x800 のアスペクト比を保ちながら、
   ビューポートに収まる最大サイズで表示する。
   - 横長端末: 高さ基準で width = h * 480/800
   - 縦長端末: 幅基準で  height = w * 800/480
   dvw/dvh はモバイルブラウザのURLバー伸縮にも追従する。 */
#game{
  display:block;
  width:  min(100vw,  calc(100vh  * 480 / 800));
  height: min(100vh,  calc(100vw  * 800 / 480));
  width:  min(100dvw, calc(100dvh * 480 / 800));
  height: min(100dvh, calc(100dvw * 800 / 480));
  touch-action:none;
  background:#1a2040;
}

/* =========== HUD =========== */
#hud{
  position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
  padding:10px 14px;
  display:none;justify-content:space-between;align-items:center;
  pointer-events:none;
  font-weight:700;font-size:13px;z-index:10;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
}
#hud.show{display:flex}
#hud .left,#hud .right{display:flex;align-items:center;gap:8px}
#stageLabel{color:#fff;letter-spacing:.04em}
#coinCount{color:#FFD23F}
#timer{color:#fff;font-variant-numeric:tabular-nums}

.icon-btn{
  pointer-events:auto;
  width:36px;height:36px;
  background:rgba(0,0,0,.35);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(4px);
  font-size:16px;color:#fff;border:none;
}
.icon-btn.off{opacity:.4}
.pause-icon{display:block;width:11px;height:13px;border-left:4px solid #fff;border-right:4px solid #fff}

/* =========== モーダル共通 =========== */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(11,15,42,.85);backdrop-filter:blur(4px);
  cursor:pointer;
}
.overlay.show{display:flex}
.card{
  background:#1e2550;border-top:4px solid #FF4D6D;
  padding:26px 22px;border-radius:14px;text-align:center;
  min-width:280px;max-width:340px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  cursor:default;
}
.card h2{font-size:24px;margin-bottom:14px;color:#FFD23F}
.card .stars{font-size:28px;margin:8px 0 12px;letter-spacing:4px}
.card .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(154,163,199,.2)}
.card .stat:last-of-type{border-bottom:none;margin-bottom:14px}
.card .stat .lbl{color:#9AA3C7}
.card .stat .val{color:#F4F6FF;font-weight:700;font-variant-numeric:tabular-nums}

.btn{
  display:block;width:100%;margin-top:8px;padding:12px;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;transition:transform .06s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:#FF4D6D}
.btn.secondary{background:rgba(255,255,255,.1);color:#F4F6FF}

#storyModal .card{max-width:350px}
#storyText{font-size:13px;line-height:1.85;color:#C8D0E8;text-align:left;white-space:pre-wrap}

/* =========== チュートリアル =========== */
#tutorial{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
  cursor:pointer;
}
#tutorial.show{display:flex}
.tut-card{
  background:#1e2550;border:2px solid #FF4D6D;
  padding:22px 26px;border-radius:14px;text-align:center;max-width:300px;
}
.tut-card h2{font-size:19px;color:#FFD23F;margin-bottom:10px}
.tut-card p{font-size:13px;line-height:1.7;margin-bottom:4px}
.tut-card .big{font-size:34px;margin:6px 0}
.tut-card .hint{font-size:11px;color:#9AA3C7;margin-top:12px}

/* =========== タイトル画面 =========== */
#title{
  position:fixed;inset:0;z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0d1525 0%,#1a2040 100%);
  cursor:pointer;
}
#title.show{display:flex}
#title h1{font-size:clamp(20px,6.5vw,36px);font-weight:900;letter-spacing:2px;text-align:center;padding:0 14px;color:#F4F6FF;text-shadow:0 3px 16px rgba(255,77,109,.5)}
#title .sub{color:#3DDCFF;font-size:12px;letter-spacing:3px;font-weight:700;margin-top:6px}
#title .cats{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:16px 0;min-height:140px}
#title .cat-img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#title .cat-img:not([src]){visibility:hidden}
#title .tap{margin-top:20px;font-size:15px;color:#FFD23F;animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.25}}
.dots{position:absolute;top:22px;display:flex;gap:7px}
.dots.l{left:20px}.dots.r{right:20px}
.dots span{width:12px;height:12px;border-radius:2px}
.d1{background:#FF4D6D}.d2{background:#FFD23F}.d3{background:#3DDCFF}

/* =========== デバッグ（必要時のみ表示） =========== */
#dbg{
  position:fixed;bottom:6px;left:6px;
  font-size:9px;color:#FFD23F;opacity:.55;
  background:rgba(0,0,0,.4);padding:3px 7px;border-radius:4px;
  z-index:9999;pointer-events:none;font-family:monospace;
}
#dbg.err{color:#FF6680;opacity:1;background:rgba(80,0,20,.85);}
</style>
</head>

<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- HUD（ゲーム中のみ表示） -->
  <div id="hud">
    <div class="left">
      <button class="icon-btn" data-action="pause" aria-label="ポーズ"><span class="pause-icon"></span></button>
      <span id="stageLabel">STAGE 1-1</span>
    </div>
    <div class="right">
      <span id="coinCount">🔔 0</span>
      <span id="timer">00:00</span>
      <button class="icon-btn" data-action="toggleSound" aria-label="サウンド">🔊</button>
    </div>
  </div>

  <!-- チュートリアル（全面タップで閉じる） -->
  <div id="tutorial" data-action="dismissTutorial">
    <div class="tut-card">
      <h2>あそびかた</h2>
      <div class="big">👆</div>
      <p><strong>タップ</strong>でジャンプ</p>
      <div class="big">👇</div>
      <p><strong>下スワイプ</strong>でスライド</p>
      <p class="hint">画面のどこでもOK・タップして開始</p>
    </div>
  </div>

  <!-- ストーリーモーダル -->
  <div class="overlay" id="storyModal">
    <div class="card">
      <div id="storyIcon" style="font-size:44px;margin-bottom:8px"></div>
      <h2 id="storyTitle"></h2>
      <p id="storyText"></p>
      <button class="btn primary" data-action="storyNext" style="margin-top:18px">つぎへ →</button>
    </div>
  </div>

  <!-- リザルト -->
  <div class="overlay" id="resultModal">
    <div class="card">
      <h2>ゴール！</h2>
      <div class="stars" id="resultStars">★★★</div>
      <div class="stat"><span class="lbl">スコア</span><span class="val" id="resultScore">0</span></div>
      <div class="stat"><span class="lbl">タイム</span><span class="val" id="resultTime">00:00</span></div>
      <div class="stat"><span class="lbl">すず</span><span class="val" id="resultCoins">0</span></div>
      <button class="btn primary" data-action="nextStage" id="nextBtn">つぎのステージへ</button>
      <button class="btn secondary" data-action="retry">もう一度</button>
    </div>
  </div>

  <!-- ゲームオーバー -->
  <div class="overlay" id="gameOverModal">
    <div class="card">
      <h2 style="color:#FF4D6D">やられた！</h2>
      <p style="margin:10px 0 18px;color:#9AA3C7;font-size:13px">もう一度がんばろう</p>
      <button class="btn primary" data-action="retry">リトライ</button>
      <button class="btn secondary" data-action="backToTitle">タイトルへ</button>
    </div>
  </div>

  <!-- ポーズ -->
  <div class="overlay" id="pauseModal">
    <div class="card" style="border-top-color:#3DDCFF">
      <h2 style="color:#3DDCFF">ポーズ</h2>
      <button class="btn primary" data-action="resume">つづける</button>
      <button class="btn secondary" data-action="retry">はじめから</button>
      <button class="btn secondary" data-action="backToTitle">タイトルへ</button>
    </div>
  </div>

  <!-- タイトル画面 -->
  <div id="title" data-action="startFromTitle">
    <div class="dots l"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
    <div class="dots r"><span class="d3"></span><span class="d2"></span><span class="d1"></span></div>
    <h1>ここちゃんとなるちゃん<br>の冒険</h1>
    <div class="sub">なるちゃんのおうちを目指せ！</div>
    <!-- キャラ立ち絵（AI生成イラストを実行時に背景透過してセット）-->
    <div class="cats">
      <img id="kokoImg" class="cat-img" alt="ここちゃん">
      <img id="naruImg" class="cat-img" alt="なるちゃん">
    </div>
    <div class="tap">タップしてスタート</div>
  </div>

  <div id="dbg">audio: ready</div>
</div>

<script>
"use strict";

/* =========================================================
 * 1. Config: 定数とステージマスター
 * ========================================================= */
const Config = {
  // ゲーム空間の論理サイズ（ピクセル単位）
  VW: 480, VH: 800, GROUND_Y: 680,

  player: {
    w: 44, h: 50,
    // 走り速度 5.4（やや速め＝歯ごたえUP）
    // ジャンプ初速 14.0（高すぎを是正）、重力 0.62 で滞空も短めに
    // holdTime/Force も控えめにして「ふわっと浮きすぎ」を解消
    speed: 5.4, jump: 14.0, gravity: 0.62,
    holdTime: 0.16, holdForce: 0.22,
    slideTime: 0.55, slideBoost: 1.35,
    stomped: 8,
  },

  input: { swipeThreshold: 20 },

  score: {
    coinVal: 100, clearBonus: 1000,
    timeBonus: 50, timeBonusCap: 90,
    // ★3 / ★2 の閾値も難易度低下に合わせて調整
    star3: 2200, star2: 1500,
  },

  notes: {
    F2:87.31,G2:98.00,A2:110.00,
    C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
    C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
    C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,
    C6:1046.50,E6:1318.51,G6:1567.98,
  },

  // BGM: melody/bass は notes のキー or null（休符）。tempo=1ステップ秒、len=ループ長。
  // ステージの雰囲気に合わせて、明るい長調 / 神秘の短調 / こだまの呼応 などを用意。
  bgm: {
    title: { tempo:0.24, len:16,
      melody:['C5',null,'E5',null,'G5',null,'E5',null,'A4',null,'C5',null,'E5',null,null,null],
      bass:  ['C3',null,null,null,'C3',null,null,null,'A3',null,null,null,'F3',null,'G3',null] },

    // 1-1 お家を出発：明るい長調・元気
    world1: { tempo:0.16, len:32,
      melody:['E4','G4','C5','G4','E4','G4','C5','E5','D5','B4','G4','B4','C5',null,'G4',null,
              'A4','C5','E5','C5','A4','C5','E5','G5','F5','D5','B4','D5','C5',null,null,null],
      bass:  ['C3',null,'C3',null,'G3',null,'G3',null,'C3',null,'C3',null,'G3',null,'G3',null,
              'F3',null,'F3',null,'G3',null,'G3',null,'C3',null,'C3',null,'G3',null,'C3',null] },

    // 1-2 街を駆け抜けろ：軽快・少し都会的
    world2: { tempo:0.17, len:32,
      melody:['A4',null,'C5','E5','A4',null,'C5','E5','G4',null,'B4','D5','G4',null,'B4','D5',
              'F4','A4','C5','A4','F4','A4','C5','E5','E4','G4','B4','G4','A4',null,null,null],
      bass:  ['A3',null,null,null,'E3',null,null,null,'G3',null,null,null,'D3',null,null,null,
              'F3',null,null,null,'C3',null,null,null,'E3',null,null,null,'A3',null,null,null] },

    // 2-1 川にうつるじぶん：流れるようなアルペジオ・長調で穏やか
    river: { tempo:0.18, len:32,
      melody:['C5','E5','G5','E5','F5','A5','G5','E5','D5','F5','A5','F5','E5','G5','C5',null,
              'D5','F5','A5','F5','G5','B5','A5','F5','E5','G5','C5','E5','D5',null,'G4',null],
      bass:  ['C3',null,'G3',null,'F3',null,'G3',null,'A3',null,'E3',null,'F3',null,'G3',null,
              'C3',null,'G3',null,'C3',null,'E3',null,'A3',null,'E3',null,'G3',null,'C3',null] },

    // 2-2 かげのもり：イ短調・神秘的でやや不安
    forest: { tempo:0.19, len:32,
      melody:['A4',null,'C5',null,'E5',null,'C5','B4','A4',null,'G4',null,'E4',null,null,null,
              'D5',null,'F5',null,'E5','D5','C5','B4','A4',null,'B4','C5','A4',null,null,null],
      bass:  ['A2',null,'E3',null,'A2',null,'E3',null,'F2',null,'C3',null,'G2',null,'D3',null,
              'D3',null,'A2',null,'C3',null,'G2',null,'A2',null,'E3',null,'A2',null,null,null] },

    // 3-1 なまえをわすれたおか：とても遅く疎ら・問いかけるように曖昧
    fog: { tempo:0.30, len:16,
      melody:['A4',null,null,'C5',null,null,'E5',null,null,'D5',null,null,'B4',null,null,null],
      bass:  ['A2',null,null,null,'F2',null,null,null,'G2',null,null,null,'E3',null,null,null] },

    // 3-2 こだまのたに：呼びかけ→低い octave のこだま返し
    valley: { tempo:0.16, len:32,
      melody:['G5','E5','C5',null,'G5','E5','C5',null,'A4','C5','E5',null,null,null,null,null,
              'G4','E4','C4',null,'G4','E4','C4',null,'A4',null,'E4',null,null,null,null,null],
      bass:  ['C3',null,null,null,'C3',null,null,null,'A3',null,null,null,null,null,null,null,
              'C3',null,null,null,'C3',null,null,null,'A3',null,null,null,null,null,null,null] },

    // 4-1 ふたつの月：静謐・夢見るように遅く
    night: { tempo:0.26, len:16,
      melody:['A4',null,'E5',null,'D5',null,'C5',null,'B4',null,'A4',null,'E4',null,null,null],
      bass:  ['A2',null,null,null,'E3',null,null,null,'F2',null,null,null,'E3',null,null,null] },

    // 4-2 はじまりのおか：明るく満ちた長調・再会の祝祭

      melody:['C5','E5','G5','C6','G5','E5','G5','C6','A5','G5','E5','G5','C6',null,'G5',null,
              'F5','A5','C6','A5','G5','B5','C6','E6','C6','A5','G5','C6','C6',null,null,null],
      bass:  ['C3',null,'C3',null,'G3',null,'G3',null,'A3',null,'A3',null,'F3',null,'G3',null,
              'F3',null,'F3',null,'C3',null,'C3',null,'G3',null,'G3',null,'C3',null,'C3',null] },
  },

  stages: [
    {
      id: '1-1', name: 'お家を出発', bgmKey: 'world1', theme: 'day',
      bgColor: ['#87CEEB','#E8D5A3'],
      story: {
        icon: '🏠', title: 'オープニング',
        text: 'ある晴れた朝、グレーのここちゃんは\n大きな黄金色の瞳をぱちりと開けました。\n\n「今日はなるちゃんのおうちに\n　遊びに行く日にゃ！」\n\nしっぽをピンと立てて、元気よく出発！',
      },
      // 1-1 は導入だが歯ごたえあり。穴・敵を程よく、間隔は 350〜500px。
      // プラットフォーム高さは最大ジャンプ到達（hold込み 約200px）以内＝y≤150。
      objects: [
        // 軽いウォームアップ
        { type:'coin',     x:340,  y:60 },
        { type:'coin',     x:400,  y:60 },
        // 最初のスライム
        { type:'enemy',    x:620,  kind:'slime' },
        // 落とし穴（標準幅）
        { type:'pit',      x:860,  w:90 },
        { type:'coin',     x:905,  y:120 },
        // 足場 → コイン → 着地
        { type:'platform', x:1120, y:100, w:110, h:16 },
        { type:'coin',     x:1175, y:140 },
        // バット（飛行敵）
        { type:'enemy',    x:1380, kind:'bat',   floatY:110 },
        // 連続気味の穴
        { type:'pit',      x:1620, w:100 },
        { type:'coin',     x:1670, y:130 },
        // スライム2連
        { type:'enemy',    x:1900, kind:'slime' },
        { type:'enemy',    x:2050, kind:'slime' },
        // 高め足場
        { type:'platform', x:2250, y:130, w:120, h:16 },
        { type:'coin',     x:2310, y:170 },
        // 鳥（速い飛行敵）
        { type:'enemy',    x:2520, kind:'bird',  floatY:90 },
        // 穴 → バット
        { type:'pit',      x:2750, w:100 },
        { type:'enemy',    x:2950, kind:'bat',   floatY:120 },
        // 最後のスライム → ゴール手前のごほうびコイン
        { type:'enemy',    x:3150, kind:'slime' },
        { type:'coin',     x:3300, y:60 },
        { type:'coin',     x:3350, y:60 },
        { type:'goal',     x:3450 },
      ],
    },
    {
      id: '1-2', name: '街を駆け抜けろ', bgmKey: 'world2', theme: 'town',
      bgColor: ['#5BB8F5','#B8E0A0'],
      story: {
        icon: '🔔', title: '幕間',
        text: '無事にお家を抜け出したここちゃん。\nでもなるちゃんのおうちまでは長い……。\n\n「こっちで合ってるかにゃ？」\n\nその時、遠くから「チリン♪」と鈴の音が！\nなるちゃんが呼んでいる！\n\n「待っててにゃ、なるちゃん！」',
      },
      // 1-2 は本番。穴を広め＆連続、敵を密集、間隔 300〜450px。
      // プラットフォーム高さは y≤150（到達可能域）に維持。
      objects: [
        { type:'enemy',    x:450,  kind:'slime' },
        { type:'enemy',    x:600,  kind:'bat',   floatY:120 },
        { type:'pit',      x:820,  w:100 },
        { type:'coin',     x:865,  y:120 },
        { type:'platform', x:1050, y:110, w:90,  h:16 },
        { type:'coin',     x:1095, y:150 },
        // 穴 → すぐ足場 → 穴の連続
        { type:'pit',      x:1280, w:110 },
        { type:'platform', x:1480, y:90,  w:80,  h:16 },
        { type:'pit',      x:1620, w:110 },
        { type:'coin',     x:1675, y:130 },
        // 飛行敵2連
        { type:'enemy',    x:1880, kind:'bird',  floatY:80 },
        { type:'enemy',    x:2050, kind:'bat',   floatY:130 },
        // スライム密集
        { type:'enemy',    x:2280, kind:'slime' },

/* =========================================================
 * 2. Audio: BGM/SFX エンジン
 *    - unlock() はユーザージェスチャー内で同期実行
 *    - 失敗しても全ての関数が安全に no-op で済む
 * ========================================================= */
const Audio = (() => {
  let ctx = null, master, bgmGain, seGain;
  let unlocked = false, enabled = true;
  let bgmTimer = null, bgmPat = null, bgmStep = 0, bgmKey = null;
  let dbgEl = null, tones = 0;

  const log = m => { if (dbgEl && !dbgEl.classList.contains('err')) dbgEl.textContent = `audio: ${m} | tones:${tones}`; };

  function _tone(freq, dur, type='square', vol=1, dest=null) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(dest || seGain);
      osc.start(t); osc.stop(t + dur + 0.05);
      tones++; log('running');
    } catch (_) {}
  }

  function _noise(dur, vol=0.3) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random()*2 - 1) * (1 - i/len);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const g = ctx.createGain(); g.gain.value = vol;
      src.connect(g); g.connect(seGain); src.start();
    } catch (_) {}
  }

  // 周波数スイープ音（fromHz→toHz）。ジャンプ/敵撃破などの効果音で共有。
  function _sweep(fromHz, toHz, dur, vol, type='square') {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type;
      const t = ctx.currentTime;
      osc.frequency.setValueAtTime(fromHz, t);
      osc.frequency.exponentialRampToValueAtTime(toHz, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(seGain);
      osc.start(t); osc.stop(t + dur + 0.05);
      tones++; log('running');
    } catch (_) {}
  }

  function _tickBgm() {
    if (!bgmPat || !enabled || !unlocked) return;
    const N = Config.notes, idx = bgmStep % bgmPat.len;
    const m = bgmPat.melody[idx], b = bgmPat.bass[idx];
    const dur = bgmPat.tempo * 0.95;
    if (m && N[m]) _tone(N[m], dur, 'square',   1, bgmGain);
    if (b && N[b]) _tone(N[b], dur, 'triangle', 1, bgmGain);
    bgmStep++;
    bgmTimer = setTimeout(_tickBgm, bgmPat.tempo * 1000);
  }

  return {
    setDbgEl(el) { dbgEl = el; log('ready'); },

    unlock() {
      if (unlocked) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { log('unsupported'); return; }
      try {
        ctx = new AC();
        // iOS Safari: 無音バッファを即座に再生してアンロック
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination); src.start(0);
        if (ctx.state === 'suspended') ctx.resume();
        master  = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.15; bgmGain.connect(master);
        seGain  = ctx.createGain(); seGain.gain.value  = 0.5;  seGain.connect(master);
        unlocked = true;
        log(`unlocked (${ctx.state})`);
      } catch (e) { log(`init err: ${e.message}`); }
    },

    startBgm(key) {
      this.stopBgm();
      bgmKey = key;
      if (!unlocked || !enabled) return;
      bgmPat = Config.bgm[key]; if (!bgmPat) return;
      bgmStep = 0; _tickBgm();
    },

    stopBgm() {
      if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
      bgmPat = null;
    },

    setEnabled(v) {
      enabled = v;
      if (!enabled) this.stopBgm();
      else if (bgmKey) this.startBgm(bgmKey);
    },

    isEnabled: () => enabled,

    sfx: {
      jump()  { _sweep(440, 880, 0.1, 0.3); },          // 上昇スイープ
      slide() { _noise(0.15, 0.15); },
      enemy() { _sweep(220, 110, 0.2, 0.3); _noise(0.1, 0.2); }, // 下降スイープ＋ノイズ
      coin() {
        const N = Config.notes;
        _tone(N.E5, 0.08, 'square', 0.5);
        setTimeout(() => _tone(N.G5, 0.15, 'square', 0.5), 70);
      },
      goal()    { const N=Config.notes; ['C5','E5','G5','C6'].forEach((k,i)=>setTimeout(()=>_tone(N[k],0.25,'square',0.5), i*100)); },
      gameOver(){ const N=Config.notes; ['G4','F4','E4','D4','C4'].forEach((k,i)=>setTimeout(()=>_tone(N[k],0.2,'triangle',0.4), i*120)); },
    },
  };
})();

/* =========================================================
 * 3. Player / Stage / Physics
 * ========================================================= */
class Player {
  constructor() {
    const pc = Config.player;
    this.x = 80; this.y = 0;
    this.w = pc.w; this.h = pc.h;
    this.vy = 0;
    this.grounded = true; this.jumping = false;
    this.sliding = false; this.slideTimer = 0;
    this.holdingJump = false; this.holdTimer = 0;
    this.animTime = 0; this.finishing = false;

    // --- 描画専用の状態（物理には影響しない）---
    this.prevVy = 0;   // 前フレームの vy（着地インパクト検出用）
    this.land   = 0;   // 着地スカッシュ量(0..1)。着地時に立ち上がり減衰
  }
  tryJump() {
    if (!this.grounded || this.sliding) return false;
    this.vy = Config.player.jump;
    this.grounded = false; this.jumping = true;
    this.holdingJump = true; this.holdTimer = 0;
    return true;
  }
  releaseJump() { this.holdingJump = false; }
  trySlide() {
    if (!this.grounded || this.sliding) return false;
    this.sliding = true; this.slideTimer = 0;
    return true;
  }
  hitbox() { return { x:this.x, y:this.y, w:this.w, h:this.sliding ? 24 : this.h }; }

  // 描画用の着地スカッシュ量を進める。物理 update の最後に呼ぶ。
  // 大きな下向き速度から接地した瞬間に land を立ち上げ、毎フレーム減衰させる。
  // CharRenderer._motion がこの land を読んで着地の「ぺちゃっ」を表現する。
  updateAnim() {
    if (this.grounded && this.prevVy < -6) {
      this.land = Math.min(1, -this.prevVy / 14);
    }
    this.land *= 0.80;
    this.prevVy = this.vy;
  }
}

class Stage {
  constructor(data) {
    this.data = data;
    this.platforms = []; this.coins = []; this.enemies = []; this.pits = [];
    this.goal = null;
    for (const o of data.objects) {
      switch (o.type) {
        case 'platform': this.platforms.push({ x:o.x, y:o.y, w:o.w, h:o.h }); break;
        case 'coin':     this.coins.push({ x:o.x, y:o.y, r:12, collected:false, anim:Math.random()*Math.PI*2 }); break;
        case 'enemy':    this.enemies.push(Stage._enemy(o)); break;
        case 'pit':      this.pits.push({ x:o.x, w:o.w }); break;
        case 'goal':     this.goal = { x:o.x }; break;
      }
    }
    // ステージの右端（カメラの上限を決めるのに使う）
    this.length = Math.max(...data.objects.map(o => o.x || 0)) + 400;
  }
  static _enemy(o) {
    const base = { x:o.x, y:0, alive:true, anim:0, kind:o.kind };
    switch (o.kind) {
      case 'bat':  return { ...base, w:34, h:24, vx:-2.5, baseY:o.floatY||120, amp:40, waveSpd:2.5 };
      case 'bird': return { ...base, w:38, h:26, vx:-4.5, baseY:o.floatY||60,  amp:0,  waveSpd:0   };
      default:     return { ...base, w:36, h:30, vx:-2.2, baseY:0,             amp:0,  waveSpd:0   };
    }
  }
}

const Physics = {
  // 着地トレランス（接地面の厚み相当）。落下速度に加算して接地猶予を決める。
  LAND_TOLERANCE: 16,
  // 画面下（穴の底）に到達したとみなす落下 y。これを下回ると死亡。
  FALL_DEATH_Y: -120,

  update(player, stage, dt, fx) {
    const pc = Config.player;
    // 60fps基準の時間ステップ。すべての加算をこれで時間正規化し、
    // 端末のfpsに関係なく速度・ジャンプ高さを一定にする。
    const step = dt * 60;

    if (player.holdingJump && player.jumping) {
      player.holdTimer += dt;
      if (player.holdTimer < pc.holdTime && player.vy > 0) player.vy += pc.holdForce * step;
    }
    if (player.sliding) {
      player.slideTimer += dt;
      if (player.slideTimer > pc.slideTime) player.sliding = false;
    }

    if (!player.finishing) {
      const vx = player.sliding ? pc.speed * pc.slideBoost : pc.speed;
      player.x += vx * step;
    }

    player.vy -= pc.gravity * step;
    player.y  += player.vy * step;

    const cx = player.x + player.w / 2;

    // 着地処理: プラットフォーム → 地面 の順に試す。
    // 地面は「穴の上を除く高さ0のプラットフォーム」とみなし、同じ _tryLand を使う。
    // 両者を同一ロジックに統一することで、片方だけ落下判定が緩く
    // “狭い穴を歩いて渡れてしまう”不整合を防ぐ。
    let landed = false;
    if (player.vy <= 0) {
      for (const p of stage.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w && this._tryLand(player, p.y + p.h, step)) {
          landed = true; break;
        }
      }
      if (!landed && !this._overPit(stage, cx)) {
        landed = this._tryLand(player, 0, step);
      }
    }
    if (!landed) player.grounded = false;

    // 画面下（穴の底）まで落ちたら死亡
    if (player.y < this.FALL_DEATH_Y) { fx.onDeath(); return; }

    // 敵
    for (const e of stage.enemies) {
      if (!e.alive) continue;
      e.anim += dt; e.x += e.vx * step;
      if (e.kind === 'bat' || e.kind === 'bird') {
        e.y = e.baseY + Math.sin(e.anim * e.waveSpd) * e.amp;
      }
      if (!this._hitEnemy(player, e)) continue;
      if (e.kind === 'bat' || e.kind === 'bird') {
        fx.onDeath(); return;
      } else if (player.vy < -3 && player.y + player.hitbox().h >= e.y + e.h - 10) {
        e.alive = false; player.vy = pc.stomped; fx.onEnemyDefeat(e);
      } else if (player.sliding) {
        e.alive = false; fx.onEnemyDefeat(e);
      } else {
        fx.onDeath(); return;
      }
    }

    // コイン
    for (const c of stage.coins) {
      if (c.collected) continue;
      c.anim += dt * 4;
      const dx = cx - c.x;
      const dy = player.y + player.h/2 - c.y;
      if (dx*dx + dy*dy < (c.r+18)*(c.r+18)) { c.collected = true; fx.onCoin(c); }
    }

    // ゴール
    if (stage.goal && !player.finishing && cx >= stage.goal.x) {
      player.finishing = true; fx.onGoal();
    }

    player.animTime += dt;
    player.updateAnim();   // 描画用の着地スカッシュを進める
  },

  // プレイヤー中心が穴の上にあるか
  _overPit(stage, cx) {
    return stage.pits.some(p => cx > p.x && cx < p.x + p.w);
  },

  // 上端 top の面に着地を試みる。落下中（vy<=0 は呼び出し側で保証）に
  // top をトレランス内で上から通過していれば着地して true を返す。
  // step は dt*60 のフレーム正規化係数。低fps時にすり抜けないよう
  // トレランスを「1フレームの落下量」と一致させる。
  _tryLand(player, top, step) {
    const fallPerFrame = Math.abs(player.vy * step);
    if (player.y <= top && player.y >= top - this.LAND_TOLERANCE - fallPerFrame) {
      player.y = top; player.vy = 0;
      player.grounded = true; player.jumping = false;
      return true;
    }
    return false;
  },

  _hitEnemy(player, e) {
    const hb = player.hitbox();
    return hb.x + hb.w > e.x && hb.x < e.x + e.w
        && hb.y < e.y + e.h && hb.y + hb.h > e.y;
  },
};

/* =========================================================
 * 4. Renderer 群
 *    - 背景・敵・キャラ・ゴール・コイン・パーティクルを描画
 *    - キャンバスのバッキングストアサイズは初期化時に1度だけ設定
 *    - 表示サイズは CSS（aspect-ratio）が担当するので resize 監視不要
 *
 * 4-0. Palette: 演出（パーティクル/コイン/速度線）で横断利用する色
 * ========================================================= */
const Palette = {
  coin:  '#FFD23F',  // すず（コイン）取得エフェクト
  hit:   '#FF4D6D',  // 敵撃破エフェクト
  speed: '#3DDCFF',  // スライド速度線
};

/* =========================================================
 * Assets: AI生成イラスト(JPEG)を読み込み、白背景を実行時に透過する。
 *
 *   - 白背景は「画像の縁から連結した明るいピクセル」だけを消す
 *     （フラッドフィル）。猫の内側の白い毛・お腹は囲まれているので残る。
 *   - 透過後に不透明部分の外接矩形でトリミングし、足元基準で扱いやすくする。
 *   - crossOrigin='anonymous' で raw.githubusercontent からの取得でも
 *     canvas が汚染されず getImageData / toDataURL が使える。
 *   - 読み込み前・失敗時は sprite が null のまま → CharRenderer が簡易シルエットを描く。
 * ========================================================= */
const Assets = {
  koko: null,  // ここちゃん（プレイヤー＆タイトル）の1枚絵 { canvas, w, h }
  naru: null,  // なるちゃん（タイトル）の1枚絵

  load(onSprite) {
    this._loadCutout('koko.jpg', s => { this.koko = s; onSprite && onSprite('koko', s); });
    this._loadCutout('naru.jpg', s => { this.naru = s; onSprite && onSprite('naru', s); });
  },

  _loadCutout(url, cb) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try { cb(this._cutout(img)); }
      catch (e) { /* canvas汚染など。スプライト無しで手描きにフォールバック */ }
    };
    img.onerror = () => {};
    img.src = url;
  },

  // 白背景フラッドフィル除去 → 白フチ侵食 → トリミングした透過 canvas を返す
  _cutout(img) {
    const W = img.width, H = img.height;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const im = ctx.getImageData(0, 0, W, H);
    const d = im.data;
    const lum = i => 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const sat = i => Math.max(d[i],d[i+1],d[i+2]) - Math.min(d[i],d[i+1],d[i+2]);

    // 背景判定: 明るく(輝度>205)かつ低彩度(<40)。白地＋薄いグレーの落ち影を拾い、
    // 猫本体（グレー=暗い／オレンジ=高彩度）は拾わない。
    const isBg = i => lum(i) > 205 && sat(i) < 40;

    // 縁からフラッドフィルして、外側につながる背景だけ透過（内側の白い毛は囲まれて残る）
    const stack = [];
    for (let x = 0; x < W; x++) { stack.push(x); stack.push((H-1)*W + x); }
    for (let y = 0; y < H; y++) { stack.push(y*W); stack.push(y*W + W-1); }
    while (stack.length) {
      const p = stack.pop();
      const i = p * 4;
      if (d[i+3] === 0) continue;       // 既に透過＝訪問済み
      if (!isBg(i)) continue;           // 背景でない＝境界で止める
      d[i+3] = 0;                       // 透過（訪問マーク兼用）
      const x = p % W, y = (p / W) | 0;
      if (x > 0)   stack.push(p - 1);
      if (x < W-1) stack.push(p + 1);
      if (y > 0)   stack.push(p - W);
      if (y < H-1) stack.push(p + W);
    }

    // 白フチ侵食: 透過に隣接する「明るい」不透明ピクセルを消す。2回繰り返して
    // アンチエイリアスの白い縁取りを除去。暗い輪郭線(輝度<175)は残すので形は保たれる。
    const isClear = p => d[p*4+3] === 0;
    for (let pass = 0; pass < 2; pass++) {
      const kill = [];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const p = y*W + x, i = p*4;
          if (d[i+3] === 0 || lum(i) < 175) continue;   // 透過 or 暗い輪郭は対象外
          if ((x>0   && isClear(p-1)) || (x<W-1 && isClear(p+1)) ||
              (y>0   && isClear(p-W)) || (y<H-1 && isClear(p+W))) kill.push(p);
        }
      }
      for (const p of kill) d[p*4+3] = 0;
    }
    ctx.putImageData(im, 0, 0);

    // 不透明部分の外接矩形でトリミング
    let minX=W, minY=H, maxX=0, maxY=0, found=false;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (d[(y*W+x)*4 + 3] > 16) {
          found = true;
          if (x<minX)minX=x; if (x>maxX)maxX=x;
          if (y<minY)minY=y; if (y>maxY)maxY=y;
        }
      }
    }
    if (!found) return { canvas: cv, w: W, h: H };
    const tw = maxX-minX+1, th = maxY-minY+1;
    const out = document.createElement('canvas');
    out.width = tw; out.height = th;
    out.getContext('2d').drawImage(cv, minX, minY, tw, th, 0, 0, tw, th);
    return { canvas: out, w: tw, h: th };
  },
};

/* 背景描画。stage.data.theme でステージごとに天体・空気・遠景・地面色・
 * 演出アクセントを切替える。奥行きは「奥の遠景→地平線ヘイズ→手前の遠景→地面」
 * の重ね順と、層ごとのパララックス係数で表現する。
 *   celestial=天体, air=空気, far=遠景シルエット種, farCol/far2Col=手前/奥の色,
 *   haze=地平線かすみ, accent=テーマ固有演出(water/fireflies/nebula/rays)。
 */
const BgRenderer = {
  THEMES: {
    day:    { celestial:'sun',      air:'clouds', far:'hills',     farCol:'rgba(96,170,76,.45)',  far2Col:'rgba(140,200,110,.30)', haze:'rgba(232,238,210,.50)', accent:'none',      grass:'#7CBA3D', grass2:'#5DAA2E', dirt:'#8B6914', plat:'#8B5A2B', platTop:'#7CBA3D' },
    town:   { celestial:'sun',      air:'clouds', far:'buildings', farCol:'rgba(86,104,134,.55)', far2Col:'rgba(120,140,170,.35)', haze:'rgba(212,226,236,.50)', accent:'none',      grass:'#7CBA3D', grass2:'#5DAA2E', dirt:'#7A6A55', plat:'#8B5A2B', platTop:'#7CBA3D' },
    river:  { celestial:'sun',      air:'clouds', far:'hills',     farCol:'rgba(96,176,186,.50)', far2Col:'rgba(160,215,222,.32)', haze:'rgba(220,240,245,.55)', accent:'water',     grass:'#7DC0C8', grass2:'#5AA6AE', dirt:'#5E7E8C', plat:'#6E8A92', platTop:'#9CC8CE' },
    forest: { celestial:'none',     air:'none',   far:'trees',     farCol:'rgba(30,72,40,.60)',   far2Col:'rgba(54,104,60,.45)',   haze:'rgba(150,185,150,.40)', accent:'fireflies', grass:'#4E8C3E', grass2:'#3C7030', dirt:'#4A3B2A', plat:'#5A4632', platTop:'#4E8C3E', mist:true },
    fog:    { celestial:'none',     air:'fog',    far:'hills',     farCol:'rgba(170,164,150,.40)',far2Col:'rgba(205,200,188,.28)', haze:'rgba(240,236,226,.60)', accent:'none',      grass:'#B0A894', grass2:'#9C9078', dirt:'#9C9484', plat:'#9A8C74', platTop:'#B0A894' },
    valley: { celestial:'moon',     air:'stars',  far:'mountains', farCol:'rgba(60,46,90,.70)',   far2Col:'rgba(100,84,138,.50)',  haze:'rgba(120,100,150,.40)', accent:'nebula',    grass:'#5A4E78', grass2:'#473C60', dirt:'#3A3060', plat:'#4A3E68', platTop:'#5A4E78' },
    night:  { celestial:'twomoons', air:'stars',  far:'hills',     farCol:'rgba(40,54,96,.65)',   far2Col:'rgba(74,92,140,.45)',   haze:'rgba(120,135,175,.35)', accent:'nebula',    grass:'#3A4E6E', grass2:'#2C3E56', dirt:'#232C44', plat:'#33405C', platTop:'#3A4E6E' },
    dawn:   { celestial:'bigsun',   air:'petals', far:'hills',     farCol:'rgba(232,176,96,.50)', far2Col:'rgba(248,210,150,.38)', haze:'rgba(255,225,180,.55)', accent:'rays',      grass:'#E6C078', grass2:'#CCA258', dirt:'#B88A4A', plat:'#C89A5E', platTop:'#E6C078' },
  },

  draw(ctx, stage, camera, VW, VH, groundY) {
    const th  = this.THEMES[(stage && stage.data.theme) || 'day'];
    const sky = stage ? stage.data.bgColor : ['#87CEEB','#E8D5A3'];

    // 空（縦グラデ）
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    // 天体・光・空気（カメラ非依存）
    if (th.accent === 'nebula') this._nebula(ctx, VW, groundY);
    this._celestial(ctx, th.celestial, VW);
    if (th.accent === 'rays') this._rays(ctx, th.celestial, VW);
    this._air(ctx, th.air, camera, VW, VH, groundY);

    if (!stage) return;

    // ワールド座標系（カメラ移動を適用）
    ctx.save();
    ctx.translate(-camera.x, 0);

    // 奥の遠景（淡く・低く・ゆっくり）
    this._farLayer(ctx, th.far, camera, groundY, th.far2Col, 0.12, 0.6);
    // 地平線ヘイズ（遠景を空気で霞ませる）
    const hz = ctx.createLinearGradient(0, groundY-160, 0, groundY);
    hz.addColorStop(0, 'rgba(255,255,255,0)'); hz.addColorStop(1, th.haze);
    ctx.fillStyle = hz; ctx.fillRect(camera.x, groundY-160, VW, 160);
    // 手前の遠景（濃く・大きく・速く）
    this._farLayer(ctx, th.far, camera, groundY, th.farCol, 0.25, 1);

    // 地面・草
    ctx.fillStyle = th.dirt;  ctx.fillRect(camera.x, groundY, VW, VH - groundY);
    ctx.fillStyle = th.grass; ctx.fillRect(camera.x, groundY, VW, 11);
    if (th.accent === 'water') this._water(ctx, camera, VW, groundY);
    // 落とし穴
    ctx.fillStyle = '#0B0F1E';
    for (const p of stage.pits) ctx.fillRect(p.x, groundY, p.w, VH-groundY);
    // 草のディテール
    ctx.fillStyle = th.grass2;
    for (let x = Math.floor(camera.x/30)*30; x < camera.x+VW; x += 30) {
      if (!stage.pits.some(p => x > p.x-10 && x < p.x+p.w+10)) {
        ctx.fillRect(x, groundY-4, 4, 8);
        ctx.fillRect(x+8, groundY-3, 3, 6);
      }
    }
    // プラットフォーム
    for (const p of stage.platforms) {
      const y = groundY - p.y - p.h;
      ctx.fillStyle = th.plat;    ctx.fillRect(p.x, y, p.w, p.h);
      ctx.fillStyle = th.platTop; ctx.fillRect(p.x, y, p.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      for (let i = 0; i < p.w; i += 20) ctx.fillRect(p.x+i, y+6, 1, p.h-6);
    }

    if (th.accent === 'fireflies') this._fireflies(ctx, camera, VW, groundY);
    ctx.restore();

    // 森：地表を這う低い霧（最前面・薄く）
    if (th.mist) {
      const t = performance.now() * 0.0004;
      ctx.fillStyle = 'rgba(220,230,225,.22)';
      for (let i = 0; i < 4; i++) {
        const x = ((i*170 - (camera.x*0.4 + t*60)) % (VW+340)) - 170;
        ctx.beginPath(); ctx.ellipse(x+170, groundY-6, 150, 20, 0, 0, Math.PI*2); ctx.fill();
      }
    }
  },

  // --- テーマ固有アクセント ---
  _nebula(ctx, VW, groundY) {  // 夜空の淡い星雲のにじみ
    [[VW*0.30, groundY*0.28, 150, 'rgba(150,120,210,.20)'],
     [VW*0.72, groundY*0.44, 190, 'rgba(90,120,205,.15)']].forEach(([bx,by,r,c]) => {
      const rg = ctx.createRadialGradient(bx,by,0, bx,by,r);
      rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, groundY);
    });
  },
  _rays(ctx, celestial, VW) {  // 朝日の光芒
    const cxp = celestial === 'bigsun' ? VW-110 : VW-80;
    const cyp = celestial === 'bigsun' ? 150 : 80;
    ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#FFF3C0';
    for (let i = 0; i < 7; i++) {
      const a = Math.PI*0.52 + i*0.17, len = 560;
      ctx.beginPath();
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(cxp+Math.cos(a)*len-16, cyp+Math.sin(a)*len);
      ctx.lineTo(cxp+Math.cos(a)*len+16, cyp+Math.sin(a)*len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  },
  _water(ctx, camera, VW, groundY) {  // 川面のきらめき（地表バンド上）
    const t = performance.now() * 0.001;
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    for (let i = 0; i < 11; i++) {
      const x = camera.x + ((i*64 + Math.sin(t + i)*10) % VW + VW) % VW;
      ctx.fillRect(x, groundY + 2 + (i%3), 16 + Math.sin(t*1.6+i)*6, 1.4);
    }
  },
  _fireflies(ctx, camera, VW, groundY) {  // 森の蛍
    const t = performance.now() * 0.001;
    for (let i = 0; i < 14; i++) {
      const x = camera.x + (((i*83 + Math.sin(t*0.7+i)*30) % VW) + VW) % VW;
      const y = groundY - 50 - ((i*47) % 150) + Math.sin(t*1.3+i)*12;
      const a = Math.max(0, 0.4 + 0.5*Math.sin(t*3 + i*1.7));
      ctx.fillStyle = '#EAFF8C';
      ctx.globalAlpha = a;       ctx.beginPath(); ctx.arc(x, y, 2,   0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a*0.35;  ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  // --- 天体 ---
  _celestial(ctx, kind, VW) {
    if (kind === 'none') return;
    ctx.save();
    if (kind === 'sun' || kind === 'bigsun') {
      const big = kind === 'bigsun';
      const cxp = big ? VW - 110 : VW - 80;
      const cyp = big ? 150 : 80;
      const r   = big ? 56 : 34;
      ctx.fillStyle = big ? '#FFB84D' : '#FFE066';
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(cxp, cyp, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 3; ctx.globalAlpha = 0.3;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(cxp+Math.cos(a)*(r+8), cyp+Math.sin(a)*(r+8));
        ctx.lineTo(cxp+Math.cos(a)*(r+24), cyp+Math.sin(a)*(r+24));
        ctx.stroke();
      }
    } else if (kind === 'moon' || kind === 'twomoons') {
      const moon = (mx, my, r) => {
        ctx.globalAlpha = 0.92; ctx.fillStyle = '#EAEFF5';
        ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(170,180,200,.45)';
        [[-r*.3,-r*.2,r*.22],[r*.25,r*.1,r*.16],[-r*.1,r*.35,r*.12]].forEach(([dx,dy,cr]) => {
          ctx.beginPath(); ctx.arc(mx+dx, my+dy, cr, 0, Math.PI*2); ctx.fill();
        });
      };
      if (kind === 'moon') moon(VW-80, 80, 30);
      else { moon(VW-95, 70, 26); moon(VW-150, 145, 17); }
    }
    ctx.restore();
  },

  // --- 空気の演出 ---
  _air(ctx, kind, camera, VW, VH, groundY) {
    if (kind === 'clouds') {
      ctx.fillStyle = 'rgba(255,255,255,.82)';
      const o = (camera.x * 0.15) % (VW + 200);
      [[VW*.2-o,100],[VW*.6-o*.7,70],[VW-o*.4,130],[VW*1.4-o,90]].forEach(([x,y]) => {
        ctx.beginPath();
        ctx.arc(x,y,24,0,Math.PI*2); ctx.arc(x+20,y-6,22,0,Math.PI*2); ctx.arc(x+40,y,20,0,Math.PI*2);
        ctx.fill();
      });
    } else if (kind === 'stars') {
      const t = performance.now() * 0.001;
      ctx.fillStyle = '#FFFFFF';
      for (let i = 0; i < 44; i++) {
        const sx = (((i*97) - camera.x*0.1) % (VW+40) + VW+40) % (VW+40);
        const sy = (i*53) % (groundY - 70) + 12;
        ctx.globalAlpha = 0.35 + 0.5 * (0.5 + 0.5*Math.sin(t*2 + i));
        ctx.beginPath(); ctx.arc(sx, sy, i%5===0 ? 1.7 : 1, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (kind === 'fog') {
      const t = performance.now() * 0.0003;
      ctx.fillStyle = 'rgba(232,229,222,.30)'; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = 'rgba(255,255,255,.20)';
      for (let i = 0; i < 4; i++) {
        const y = 90 + i*70;
        const x = ((i*180 - (camera.x*0.2 + t*40)) % (VW+340)) - 170;
        ctx.beginPath(); ctx.ellipse(x+170, y, 170, 28, 0, 0, Math.PI*2); ctx.fill();
      }
    } else if (kind === 'petals') {
      const t = performance.now() * 0.001;
      ctx.fillStyle = 'rgba(255,180,200,.85)';
      for (let i = 0; i < 22; i++) {
        const px = (((i*71) - camera.x*0.3) % (VW+40) + VW+40) % (VW+40);
        const py = ((i*43 + t*42*(0.6 + (i%3)*0.2)) % (groundY+20));
        ctx.save(); ctx.translate(px + Math.sin(t*2+i)*8, py); ctx.rotate(t + i);
        ctx.beginPath(); ctx.ellipse(0, 0, 4, 2.2, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  },

  // --- 遠景シルエット（1層分）---
  // par=パララックス係数（小=遠くゆっくり）, scale=高さ倍率（奥は低く）。
  // 同じ種を色・par・scale を変えて2回呼び、奥行きの2層を作る。
  _farLayer(ctx, kind, camera, groundY, col, par, scale) {
    ctx.fillStyle = col;
    const off = camera.x * par;
    if (kind === 'hills') {
      const sp = 300;
      for (let i = -1; i < 8; i++) {
        const x = camera.x + i*sp - (off%sp), h = 110*scale;
        ctx.beginPath();
        ctx.moveTo(x, groundY);
        ctx.bezierCurveTo(x+60, groundY-h, x+sp*0.6, groundY-h, x+sp, groundY);
        ctx.closePath(); ctx.fill();
      }
    } else if (kind === 'trees') {
      const sp = 140;
      for (let i = -1; i < 11; i++) {
        const x = camera.x + i*sp - (off%sp), h = (75 + (i*37)%40) * scale;
        this._pine(ctx, x, groundY, h);
      }
    } else if (kind === 'mountains') {
      const sp = 260;
      for (let i = -1; i < 6; i++) {
        const x = camera.x + i*sp - (off%sp), h = 150*scale, px = x+95;
        ctx.beginPath();
        ctx.moveTo(x-20, groundY); ctx.lineTo(px, groundY-h); ctx.lineTo(x+210, groundY);
        ctx.closePath(); ctx.fill();
        // 雪を被った稜線のハイライト（月光）
        ctx.fillStyle = 'rgba(255,255,255,.12)';
        ctx.beginPath();
        ctx.moveTo(px, groundY-h); ctx.lineTo(px-22, groundY-h*0.62); ctx.lineTo(px+8, groundY-h*0.66);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = col;
      }
    } else if (kind === 'buildings') {
      const sp = 110;
      for (let i = -1; i < 11; i++) {
        const x = camera.x + i*sp - (off%sp), h = (70 + (i*53)%80) * scale;
        ctx.fillRect(x, groundY-h, 84, h);
        // 窓
        ctx.fillStyle = 'rgba(0,0,0,.14)';
        for (let wy = groundY-h+12; wy < groundY-12; wy += 20)
          for (let wx = x+10; wx < x+74; wx += 20) ctx.fillRect(wx, wy, 9, 11);
        ctx.fillStyle = col;
      }
    }
  },
  _pine(ctx, x, groundY, h) {  // 三段重ねの松シルエット
    const w = h*0.55;
    for (let k = 0; k < 3; k++) {
      const ty = groundY - (h*0.30)*k, tw = w*(1 - k*0.22);
      ctx.beginPath();
      ctx.moveTo(x, ty - h*0.5); ctx.lineTo(x - tw/2, ty); ctx.lineTo(x + tw/2, ty);
      ctx.closePath(); ctx.fill();
    }
  },
};

const EnemyRenderer = {
  draw(ctx, e, groundY) {
    if (!e.alive) return;
    if      (e.kind === 'bat')  this._bat(ctx, e, groundY);
    else if (e.kind === 'bird') this._bird(ctx, e, groundY);
    else                        this._slime(ctx, e, groundY);
  },
  _slime(ctx, e, groundY) {
    const y = groundY - e.h, sq = Math.sin(e.anim*5)*0.1;
    ctx.save(); ctx.translate(e.x+e.w/2, y+e.h);
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,4,18,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9c27b0'; ctx.beginPath(); ctx.ellipse(0,-e.h/2,e.w/2,e.h/2+sq*5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(-6,-e.h/2-4,4,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  _bat(ctx, e, groundY) {
    const sy = groundY - e.y - e.h, flap = Math.sin(e.anim*12)*0.4;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    ctx.fillStyle='#5c2a8a';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*22,-8+flap*18,dir*30,4+flap*10);
      ctx.quadraticCurveTo(dir*18,8,0,4); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    ctx.fillStyle='#7b3fad'; ctx.beginPath(); ctx.ellipse(0,2,10,10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c2a8a';
    ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(-8,-14); ctx.lineTo(-2,-8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,-6);  ctx.lineTo(8,-14);  ctx.lineTo(2,-8);  ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FF4D6D'; ctx.beginPath(); ctx.arc(-4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  _bird(ctx, e, groundY) {
    const sy = groundY - e.y - e.h, flap = Math.sin(e.anim*16)*0.5;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    ctx.fillStyle='#FF8C00';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*15,-10+flap*14,dir*26,-2+flap*8);
      ctx.quadraticCurveTo(dir*12,6,0,2); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,1,11,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF6B00'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-18,-2); ctx.lineTo(-10,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0B0F2A'; ctx.beginPath(); ctx.arc(-4,-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-3,1,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#FFD23F'; ctx.lineWidth=1.5; ctx.globalAlpha=0.5;
    for (let i=1;i<=3;i++) { ctx.beginPath(); ctx.moveTo(8+i*7,-3+i*2); ctx.lineTo(16+i*7,-3+i*2); ctx.stroke(); }
    ctx.globalAlpha=1;
    ctx.restore();
  },
};

/* ここちゃん（プレイヤー）描画。
 *
 *   - 通常は Assets.koko（AI生成イラストを背景透過した1枚絵）を全状態に使い、
 *     走り/ジャンプ/着地/スライドは _motion の変形（跳ね・回転・伸縮）で表現する。
 *     AIの複数コマ生成はキャラがドリフトして別猫に見えるため、コマ送りは不採用。
 *   - 画像が未ロード/失敗のときだけ _fallback（簡易シルエット）を描く。
 */
const CharRenderer = {
  FEET: 22,     // 体中心→足裏の距離(ローカル)。スカッシュの軸を足裏にするのに使う
  DISP_H: 62,   // スプライト表示の高さ(px)。当たり判定(h=50)より少し大きめ

  draw(ctx, player, groundY) {
    const cx = player.x + player.w / 2;
    const cy = (groundY - player.y - player.h) + player.h / 2;

    // 影（落下/上昇で薄く小さく）
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.globalAlpha = Math.max(0.1, 0.4 - Math.abs(player.vy) * 0.02);
    ctx.beginPath();
    ctx.ellipse(cx, groundY - 2, player.sliding ? 28 : 20, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    const grounded = player.grounded && !player.jumping;
    const M = this._motion(player, grounded);   // {bob, rot, st}

    ctx.save();
    // 足裏を軸に: 足裏を接地点へ→回転→スケール
    ctx.translate(cx, cy + this.FEET + M.bob);
    ctx.rotate(M.rot);
    ctx.scale(1 / M.st, M.st);   // 体積保存（縦に伸びたら横は縮む）

    const spr = Assets.koko;
    if (spr) {
      const dh = this.DISP_H * (player.sliding ? 0.9 : 1);
      const dw = dh * spr.w / spr.h;
      ctx.drawImage(spr.canvas, -dw/2, -dh + 2, dw, dh);
    } else {
      this._fallback(ctx);   // 画像が無いときだけ
    }
    ctx.restore();
  },

  // 画像未ロード/失敗時の簡易シルエット（足裏が原点 y=0、上に積む）。
  // 形だけ示すフォールバックなので最小限。本番は常に Assets.koko を使う。
  _fallback(ctx) {
    ctx.fillStyle = '#9CABB8';
    ctx.strokeStyle = '#39434F';
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    // 体
    ctx.beginPath(); ctx.ellipse(0, -14, 17, 13, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // 頭
    ctx.beginPath(); ctx.ellipse(9, -32, 12, 11, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // 耳
    ctx.beginPath(); ctx.moveTo(3,-40); ctx.lineTo(1,-50); ctx.lineTo(9,-44); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13,-42); ctx.lineTo(17,-52); ctx.lineTo(18,-40); ctx.closePath(); ctx.fill(); ctx.stroke();
  },

  // 状態に応じた {bob, rot, st} を返す。1枚絵を変形して躍動感を出す。
  //   走行: 跳ねる(bob)＋前後ロック(rot)＋上で伸び接地で縮む(st)＝ギャロップ感
  //   空中: 落下速度で前傾/後傾(rot)＋縦伸び(st)。上昇=前のめり、落下=反る
  //   スライド: 前傾して低く潰れる
  //   着地(land): 一瞬ぺちゃっと潰れる（全状態に重畳）
  _motion(player, grounded) {
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let bob = 0, rot = 0, st = 1;

    if (player.sliding) {
      rot = 0.5; st = 0.72; bob = 6;
    } else if (grounded) {
      const c = player.animTime * 14;
      const hop = Math.abs(Math.sin(c));
      bob = -hop * 5;                           // 体が浮く
      rot = Math.sin(c) * 0.12;                 // 前後に揺れる
      st  = 1 + (hop - 0.4) * 0.14;             // 浮きで伸び・接地で縮む
    } else {
      rot = clamp(-player.vy * 0.013, -0.26, 0.22);
      st  = 1 + Math.min(0.24, Math.abs(player.vy) * 0.012);
    }
    st -= player.land * 0.5;                    // 着地インパクトで潰す
    st  = clamp(st, 0.66, 1.32);
    return { bob, rot, st };
  },
};

/* ゴール旗の描画 — 絵本イラスト風のチェッカーフラッグ
 *
 * 描画方針:
 *   - ポール（茶色）＋ 上端の金の玉
 *   - 旗布は赤白チェッカー、風で軽くなびく（sin 波で頂点を揺らす）
 *   - goal.x はゴール判定の x。旗ポールはそこに立てる。
 *
 * 配色:
 *   POLE = #A9803E (ポール) / POLE_D = #7A5A28 (陰) / KNOB = #FFD23F (玉)
 *   FLAG_A = #FF4D6D / FLAG_B = #FFF7FA (赤白チェッカー)
 *   OUT = #5A3818 (輪郭)
 */
const GoalRenderer = {
  C: { POLE:'#A9803E', POLE_D:'#7A5A28', KNOB:'#FFD23F', FLAG_A:'#FF4D6D', FLAG_B:'#FFF7FA', OUT:'#5A3818' },

  draw(ctx, goal, groundY) {
    const C = this.C;
    const t = performance.now() * 0.001;
    const wave = Math.sin(t * 4);          // 旗のなびき
    const poleX = goal.x;                  // ポールの中心 x
    const poleTopY = groundY - 150;        // ポール上端の画面 y
    const poleBotY = groundY;              // 地面

    ctx.save();

    // 影
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.ellipse(poleX, groundY - 2, 22, 5, 0, 0, Math.PI*2);
    ctx.fill();

    // ポール本体
    ctx.fillStyle   = C.POLE;
    ctx.strokeStyle = C.OUT;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.rect(poleX - 3, poleTopY, 6, poleBotY - poleTopY);
    ctx.fill(); ctx.stroke();
    // ポールの陰影
    ctx.fillStyle = C.POLE_D;
    ctx.fillRect(poleX + 0.5, poleTopY + 1, 2, poleBotY - poleTopY - 2);

    // 上端の金の玉
    ctx.fillStyle   = C.KNOB;
    ctx.strokeStyle = C.OUT;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.arc(poleX, poleTopY - 4, 6, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.arc(poleX - 2, poleTopY - 6, 1.6, 0, Math.PI*2);
    ctx.fill();

    // === 旗布（赤白チェッカー、右方向へなびく）===
    // 4列×3行のセル。右に行くほど波の振幅が大きくなる。
    const flagX = poleX + 3;     // 旗の付け根 x
    const flagY = poleTopY + 4;  // 旗の上端 y
    const cols = 4, rows = 3, cell = 16;
    const flagW = cols * cell, flagH = rows * cell;

    // x方向の位置に応じた揺れ量
    const sway = (gx) => wave * (gx / flagW) * 6;

    // クリップ用に旗全体の輪郭を作る関数
    const flagOutline = () => {
      ctx.beginPath();
      ctx.moveTo(flagX, flagY);
      // 上辺
      for (let i = 0; i <= cols; i++) {
        const gx = i * cell;
        ctx.lineTo(flagX + gx, flagY + sway(gx));
      }
      // 右辺〜下辺
      for (let i = cols; i >= 0; i--) {
        const gx = i * cell;
        ctx.lineTo(flagX + gx, flagY + flagH + sway(gx));
      }
      ctx.closePath();
    };

    // チェッカー塗り（クリップ内に市松模様）
    ctx.save();
    flagOutline();
    ctx.clip();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const gx = c * cell;
        ctx.fillStyle = ((r + c) % 2 === 0) ? C.FLAG_A : C.FLAG_B;
        ctx.beginPath();
        ctx.moveTo(flagX + gx,        flagY + r*cell     + sway(gx));
        ctx.lineTo(flagX + gx + cell, flagY + r*cell     + sway(gx+cell));
        ctx.lineTo(flagX + gx + cell, flagY + (r+1)*cell + sway(gx+cell));
        ctx.lineTo(flagX + gx,        flagY + (r+1)*cell + sway(gx));
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();

    // 旗の輪郭線
    ctx.strokeStyle = C.OUT;
    ctx.lineWidth   = 1.6;
    ctx.lineJoin    = 'round';
    flagOutline();
    ctx.stroke();

    // ゴールサイン（旗の上に「GOAL」）
    ctx.fillStyle  = '#FFFFFF';
    ctx.font       = 'bold 11px sans-serif';
    ctx.textAlign  = 'center';
    ctx.strokeStyle = C.OUT;
    ctx.lineWidth   = 3;
    ctx.strokeText('GOAL', poleX + flagW/2, poleTopY - 14);
    ctx.fillText('GOAL', poleX + flagW/2, poleTopY - 14);

    ctx.restore();
  },
};

/* コイン（すず）描画。
 * Renderer.draw からインラインで剥がして他の *Renderer と同じ altitude に揃えた。
 * HUDの🔔 アイコンを Canvas に置く場合もこれを呼び出せる。
 */
const CoinRenderer = {
  draw(ctx, coin, groundY) {
    if (coin.collected) return;
    const y = groundY - coin.y;
    const wob = Math.sin(coin.anim) * 3;
    ctx.save();
    ctx.translate(coin.x, y + wob);
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(0, 13, 9, 3, 0, 0, Math.PI*2); ctx.fill();
    // 金色グラデーション本体
    const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 11);
    g.addColorStop(0, '#FFE57F'); g.addColorStop(1, '#FFB300');
    ctx.fillStyle = g; ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // 中央のハイライト線
    ctx.fillStyle = '#FFF'; ctx.fillRect(-1, -5, 2, 10);
    ctx.restore();
  },
};

const Renderer = {
  canvas: null, ctx: null,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    // バッキングストアは固定サイズ。表示サイズは CSS が担当。
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width  = Config.VW * dpr;
    canvas.height = Config.VH * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  draw(state) {
    const { stage, camera, player, particles } = state;
    const { VW, VH, GROUND_Y } = Config;
    const ctx = this.ctx;

    BgRenderer.draw(ctx, stage, camera, VW, VH, GROUND_Y);
    if (!stage) return;

    ctx.save();
    ctx.translate(-camera.x, 0);

    for (const c of stage.coins)   CoinRenderer.draw(ctx, c, GROUND_Y);
    for (const e of stage.enemies) EnemyRenderer.draw(ctx, e, GROUND_Y);
    if (stage.goal)                GoalRenderer.draw(ctx, stage.goal, GROUND_Y);
    if (player)                    CharRenderer.draw(ctx, player, GROUND_Y);
    this._drawParticles(ctx, particles, GROUND_Y);

    ctx.restore();
  },

  _drawParticles(ctx, particles, groundY) {
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillRect(p.x - p.size/2, groundY - p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  },
};

/* =========================================================
 * 5. UI: DOM ヘルパー
 *    各画面の表示切替・HUDのテキスト更新のみを担当
 * ========================================================= */
const UI = {
  el: {},
  init() {
    const ids = [
      'title','hud','tutorial','storyModal','resultModal','gameOverModal','pauseModal',
      'stageLabel','coinCount','timer','resultStars','resultScore','resultTime','resultCoins',
      'nextBtn','storyIcon','storyTitle','storyText','dbg','kokoImg','naruImg',
    ];
    ids.forEach(id => this.el[id] = document.getElementById(id));
  },

  // 透過済みスプライト canvas をタイトルの <img> にセット
  setTitleSprite(which, sprite) {
    const el = which === 'koko' ? this.el.kokoImg : this.el.naruImg;
    if (el && sprite) el.src = sprite.canvas.toDataURL();
  },
  show(id) { this.el[id].classList.add('show'); },
  hide(id) { this.el[id].classList.remove('show'); },
  hideAllOverlays() {
    ['title','tutorial','storyModal','resultModal','gameOverModal','pauseModal'].forEach(id => this.hide(id));
  },
  setStage(label)  { this.el.stageLabel.textContent = `STAGE ${label}`; },
  setCoins(n)      { this.el.coinCount.textContent  = `🔔 ${n}`; },
  setTimer(secs)   {
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = Math.floor(secs%60).toString().padStart(2,'0');
    this.el.timer.textContent = `${m}:${s}`;
  },
  setSoundIcon(on, btn) { btn.textContent = on ? '🔊' : '🔇'; btn.classList.toggle('off', !on); },

  showStory(story, onClose) {
    this.el.storyIcon.textContent  = story.icon;
    this.el.storyTitle.textContent = story.title;
    this.el.storyText.textContent  = story.text;
    this._storyClose = onClose;
    this.show('storyModal');
  },
  closeStory() {
    this.hide('storyModal');
    const cb = this._storyClose; this._storyClose = null;
    if (cb) cb();
  },

  showResult(stars, score, secs, coins, hasNext) {
    this.el.resultStars.textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
    this.el.resultScore.textContent = score;
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = Math.floor(secs%60).toString().padStart(2,'0');
    this.el.resultTime.textContent  = `${m}:${s}`;
    this.el.resultCoins.textContent = coins;
    this.el.nextBtn.style.display = hasNext ? 'block' : 'none';
    this.show('resultModal');
  },

  reportError(msg) {
    if (!this.el.dbg) return;
    this.el.dbg.classList.add('err');
    this.el.dbg.textContent = `ERR: ${msg}`.slice(0, 200);
  },
};

/* =========================================================
 * 6. Game: ステートマシン
 *
 * 状態遷移図:
 *   TITLE → STORY → TUTORIAL → PLAYING ⇄ PAUSED
 *                     ↑               ↓
 *                     └──RETRY──── RESULT / GAMEOVER → TITLE
 *
 *   各遷移は Game.actions の関数1個に対応し、
 *   HTML の data-action 属性 から呼ばれる。
 * ========================================================= */
const MODE = { TITLE:'title', STORY:'story', TUTORIAL:'tutorial', PLAYING:'playing', PAUSED:'paused', RESULT:'result', GAMEOVER:'gameover' };

const Game = {
  state: {
    mode: MODE.TITLE,
    stageIdx: 0,
    stage: null, player: null,
    camera: { x:0 },
    coins: 0, timer: 0, particles: [],
    seenTutorial: false,
  },

  // ----- ライフサイクル -----
  init() {
    UI.show('title');
    Audio.startBgm('title');
  },

  _loadStage(idx) {
    const s = this.state;
    s.stageIdx  = idx;
    s.stage     = new Stage(Config.stages[idx]);
    s.player    = new Player();
    s.camera.x  = 0;
    s.coins     = 0;
    s.timer     = 0;
    s.particles = [];
    UI.setStage(s.stage.data.id);
    UI.setCoins(0); UI.setTimer(0);
    UI.el.hud.classList.add('show');
    Audio.startBgm(s.stage.data.bgmKey);
  },

  _addParticles(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      this.state.particles.push({
        x, y,
        vx: (Math.random()-.5)*6,
        vy: Math.random()*5+2,
        life: 0.5+Math.random()*0.3,
        color, size: 3+Math.random()*2,
      });
    }
  },

  // ----- Physics コールバック -----
  fx: {
    onCoin(c) {
      Game.state.coins++;
      Game._addParticles(c.x, c.y, 6, Palette.coin);
      Audio.sfx.coin();
    },
    onEnemyDefeat(e) {
      Game._addParticles(e.x+e.w/2, e.y+e.h/2, 8, Palette.hit);
      Audio.sfx.enemy();
    },
    onGoal()  { Game._stageClear(); },
    onDeath() { Game._gameOver(); },
  },

  _stageClear() {
    const s = this.state;
    s.mode = MODE.RESULT;
    Audio.stopBgm(); Audio.sfx.goal();

    const sc = Config.score;
    const timeBonus = Math.max(0, Math.floor((sc.timeBonusCap - s.timer) * sc.timeBonus));
    const score = s.coins * sc.coinVal + timeBonus + sc.clearBonus;
    const stars = score >= sc.star3 ? 3 : score >= sc.star2 ? 2 : 1;
    const hasNext = s.stageIdx < Config.stages.length - 1;

    setTimeout(() => {
      const next = Config.stages[s.stageIdx + 1];
      if (hasNext && next && next.story) {
        UI.showStory(next.story, () => UI.showResult(stars, score, s.timer, s.coins, hasNext));
      } else {
        UI.showResult(stars, score, s.timer, s.coins, hasNext);
      }
    }, 800);
  },

  _gameOver() {
    this.state.mode = MODE.GAMEOVER;
    Audio.stopBgm(); Audio.sfx.gameOver();
    UI.show('gameOverModal');
  },

  // ----- 入力ハンドラ -----
  onJumpStart() {
    if (this.state.mode !== MODE.PLAYING) return;
    if (this.state.player.tryJump()) {
      this._addParticles(this.state.player.x+this.state.player.w/2, this.state.player.y, 6, Palette.coin);
      Audio.sfx.jump();
    }
  },
  onJumpEnd() { if (this.state.player) this.state.player.releaseJump(); },
  onSlide() {
    if (this.state.mode !== MODE.PLAYING) return;
    if (this.state.player.trySlide()) {
      this._addParticles(this.state.player.x+this.state.player.w/2, this.state.player.y+4, 4, Palette.speed);
      Audio.sfx.slide();
    }
  },

  // ----- UI から呼ばれるアクション（data-action 名と一致） -----
  actions: {
    startFromTitle() {
      Audio.unlock();
      Audio.sfx.coin();
      UI.hide('title');
      Game.state.mode = MODE.STORY;
      UI.showStory(Config.stages[0].story, () => Game.actions.afterFirstStory());
    },
    afterFirstStory() {
      Game._loadStage(0);
      if (!Game.state.seenTutorial) {
        Game.state.mode = MODE.TUTORIAL;
        UI.show('tutorial');
      } else {
        Game.state.mode = MODE.PLAYING;
      }
    },
    storyNext() {
      // ストーリー閉じ。状態は UI.closeStory のコールバックが進める。
      UI.closeStory();
    },
    dismissTutorial() {
      if (Game.state.mode !== MODE.TUTORIAL) return;
      UI.hide('tutorial');
      Game.state.seenTutorial = true;
      Game.state.mode = MODE.PLAYING;
    },
    pause() {
      if (Game.state.mode !== MODE.PLAYING) return;
      Game.state.mode = MODE.PAUSED;
      Audio.stopBgm();
      UI.show('pauseModal');
    },
    resume() {
      if (Game.state.mode !== MODE.PAUSED) return;
      UI.hide('pauseModal');
      Game.state.mode = MODE.PLAYING;
      Audio.startBgm(Game.state.stage.data.bgmKey);
    },
    retry() {
      UI.hideAllOverlays();
      Game._loadStage(Game.state.stageIdx);
      Game.state.mode = MODE.PLAYING;
    },
    nextStage() {
      UI.hide('resultModal');
      if (Game.state.stageIdx < Config.stages.length - 1) {
        Game._loadStage(Game.state.stageIdx + 1);
        Game.state.mode = MODE.PLAYING;
      } else {
        Game.actions.backToTitle();
      }
    },
    backToTitle() {
      UI.hideAllOverlays();
      UI.el.hud.classList.remove('show');
      UI.show('title');
      Game.state.mode = MODE.TITLE;
      Audio.startBgm('title');
    },
    toggleSound(btn) {
      Audio.unlock();
      const next = !Audio.isEnabled();
      Audio.setEnabled(next);
      UI.setSoundIcon(next, btn);
      if (next) Audio.sfx.coin();
    },
  },

  // ----- ループ -----
  update(dt) {
    if (this.state.mode !== MODE.PLAYING) return;
    const s = this.state;
    s.timer += dt;
    Physics.update(s.player, s.stage, dt, this.fx);

    // カメラ追従（プレイヤーを画面30%に保つ）
    // fpsに依存しない指数追従：60fpsで15%詰めるのと等価な係数を dt から計算
    const tx = s.player.x - Config.VW * 0.30;
    const camK = 1 - Math.pow(1 - 0.15, dt * 60);
    s.camera.x += (tx - s.camera.x) * camK;
    s.camera.x = Math.max(0, Math.min(s.camera.x, s.stage.length - Config.VW));

    // パーティクル（dt正規化）
    const pstep = dt * 60;
    for (let i = s.particles.length-1; i >= 0; i--) {
      const p = s.particles[i];
      p.x += p.vx * pstep; p.y += p.vy * pstep; p.vy -= 0.3 * pstep; p.life -= dt;
      if (p.life <= 0) s.particles.splice(i, 1);
    }

    UI.setCoins(s.coins);
    UI.setTimer(s.timer);
  },
};

/* =========================================================
 * 7. Input: ポインタ＋キーボード入力
 *    PointerEvents で touch/mouse/pen を統一。
 *    UI要素（data-action 持ち / button）の上ではゲーム入力を発火しない。
 * ========================================================= */
const Input = {
  startY: null, swiped: false, gestureOnUI: false,

  init() {
    document.addEventListener('pointerdown', e => this._down(e), { passive: false });
    document.addEventListener('pointermove', e => this._move(e), { passive: false });
    document.addEventListener('pointerup',   e => this._up(e),   { passive: false });
    document.addEventListener('pointercancel', () => { this.startY = null; this.gestureOnUI = false; });

    // data-action のクリック委譲（PointerEvents由来のclickもここで処理）
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const fn = Game.actions[t.dataset.action];
      if (fn) fn(t);
    });

    document.addEventListener('keydown', e => {
      if (Game.state.mode !== MODE.PLAYING) return;
      if (e.code === 'Space' || e.code === 'ArrowUp')   { e.preventDefault(); Game.onJumpStart(); }
      else if (e.code === 'ArrowDown')                  { e.preventDefault(); Game.onSlide(); }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') Game.onJumpEnd();
    });
  },

  // UI 要素（クリック対象）の上では preventDefault を呼ばない。
  // → click イベントが正常に発火し、上の data-action ディスパッチが動く。
  _isUI(el) {
    while (el && el !== document.body) {
      if (el.tagName === 'BUTTON') return true;
      if (el.dataset && el.dataset.action) return true;
      el = el.parentElement;
    }
    return false;
  },

  _down(e) {
    this.gestureOnUI = this._isUI(e.target);
    if (this.gestureOnUI) return;
    // プレイ中以外は preventDefault しない（モーダル外のタップが暴発しないように）
    if (Game.state.mode !== MODE.PLAYING) return;
    e.preventDefault();
    this.startY = e.clientY;
    this.swiped = false;
    Game.onJumpStart();
  },
  _move(e) {
    if (this.gestureOnUI || this.startY === null) return;
    if (Game.state.mode !== MODE.PLAYING) return;
    e.preventDefault();
    if (e.clientY - this.startY > Config.input.swipeThreshold && !this.swiped) {
      this.swiped = true;
      Game.onSlide();
    }
  },
  _up(e) {
    if (this.gestureOnUI) { this.gestureOnUI = false; return; }
    if (this.startY === null) return;
    if (Game.state.mode === MODE.PLAYING) e.preventDefault();
    this.startY = null;
    Game.onJumpEnd();
  },
};

/* =========================================================
 * 8. Bootstrap
 * ========================================================= */
(function main() {
  UI.init();
  Audio.setDbgEl(UI.el.dbg);
  Renderer.init(document.getElementById('game'));
  Input.init();
  Game.init();

  // キャラのAI生成イラストを読み込み、背景透過してタイトル＆プレイヤーに反映
  Assets.load((which, sprite) => UI.setTitleSprite(which, sprite));

  // 致命的なエラーが起きたらデバッグ表示に出す（ループは継続）
  window.addEventListener('error', e => UI.reportError((e.error && e.error.message) || e.message));
  window.addEventListener('unhandledrejection', e => UI.reportError((e.reason && e.reason.message) || String(e.reason)));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    try {
      Game.update(dt);
      Renderer.draw(Game.state);
    } catch (e) {
      UI.reportError(e.message);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
