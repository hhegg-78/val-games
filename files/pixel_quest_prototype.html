<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ここちゃんとなるちゃんの冒険</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* =========================================================
 * 基本設計
 *   - ゲーム空間は 480x800 で固定
 *   - キャンバスは CSS の aspect-ratio で常に 480:800 を維持
 *     しつつ、ビューポートに合うサイズで letterbox 表示
 *   - JS は resize の計算を一切持たない（iframe 内で innerWidth
 *     が嘘をついてもブラウザ任せで安定する）
 * ========================================================= */

*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#1a2040;color:#F4F6FF;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  touch-action:none;
}

#app{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* キャンバス: 480x800 のアスペクト比を保ちながら、
   ビューポートに収まる最大サイズで表示する。
   - 横長端末: 高さ基準で width = h * 480/800
   - 縦長端末: 幅基準で  height = w * 800/480
   dvw/dvh はモバイルブラウザのURLバー伸縮にも追従する。 */
#game{
  display:block;
  width:  min(100vw,  calc(100vh  * 480 / 800));
  height: min(100vh,  calc(100vw  * 800 / 480));
  width:  min(100dvw, calc(100dvh * 480 / 800));
  height: min(100dvh, calc(100dvw * 800 / 480));
  touch-action:none;
  background:#1a2040;
}

/* =========== HUD =========== */
#hud{
  position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
  padding:10px 14px;
  display:none;justify-content:space-between;align-items:center;
  pointer-events:none;
  font-weight:700;font-size:13px;z-index:10;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
}
#hud.show{display:flex}
#hud .left,#hud .right{display:flex;align-items:center;gap:8px}
#stageLabel{color:#fff;letter-spacing:.04em}
#coinCount{color:#FFD23F}
#timer{color:#fff;font-variant-numeric:tabular-nums}

.icon-btn{
  pointer-events:auto;
  width:36px;height:36px;
  background:rgba(0,0,0,.35);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(4px);
  font-size:16px;color:#fff;border:none;
}
.icon-btn.off{opacity:.4}
.pause-icon{display:block;width:11px;height:13px;border-left:4px solid #fff;border-right:4px solid #fff}

/* =========== モーダル共通 =========== */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(11,15,42,.85);backdrop-filter:blur(4px);
  cursor:pointer;
}
.overlay.show{display:flex}
.card{
  background:#1e2550;border-top:4px solid #FF4D6D;
  padding:26px 22px;border-radius:14px;text-align:center;
  min-width:280px;max-width:340px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  cursor:default;
}
.card h2{font-size:24px;margin-bottom:14px;color:#FFD23F}
.card .stars{font-size:28px;margin:8px 0 12px;letter-spacing:4px}
.card .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(154,163,199,.2)}
.card .stat:last-of-type{border-bottom:none;margin-bottom:14px}
.card .stat .lbl{color:#9AA3C7}
.card .stat .val{color:#F4F6FF;font-weight:700;font-variant-numeric:tabular-nums}

.btn{
  display:block;width:100%;margin-top:8px;padding:12px;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;color:#fff;
  cursor:pointer;transition:transform .06s ease;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:#FF4D6D}
.btn.secondary{background:rgba(255,255,255,.1);color:#F4F6FF}

#storyModal .card{max-width:350px}
#storyText{font-size:13px;line-height:1.85;color:#C8D0E8;text-align:left;white-space:pre-wrap}

/* =========== チュートリアル =========== */
#tutorial{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
  cursor:pointer;
}
#tutorial.show{display:flex}
.tut-card{
  background:#1e2550;border:2px solid #FF4D6D;
  padding:22px 26px;border-radius:14px;text-align:center;max-width:300px;
}
.tut-card h2{font-size:19px;color:#FFD23F;margin-bottom:10px}
.tut-card p{font-size:13px;line-height:1.7;margin-bottom:4px}
.tut-card .big{font-size:34px;margin:6px 0}
.tut-card .hint{font-size:11px;color:#9AA3C7;margin-top:12px}

/* =========== タイトル画面 =========== */
#title{
  position:fixed;inset:0;z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#0d1525 0%,#1a2040 100%);
  cursor:pointer;
}
#title.show{display:flex}
#title h1{font-size:clamp(20px,6.5vw,36px);font-weight:900;letter-spacing:2px;text-align:center;padding:0 14px;color:#F4F6FF;text-shadow:0 3px 16px rgba(255,77,109,.5)}
#title .sub{color:#3DDCFF;font-size:12px;letter-spacing:3px;font-weight:700;margin-top:6px}
#title .tap{margin-top:36px;font-size:15px;color:#FFD23F;animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.25}}
.dots{position:absolute;top:22px;display:flex;gap:7px}
.dots.l{left:20px}.dots.r{right:20px}
.dots span{width:12px;height:12px;border-radius:2px}
.d1{background:#FF4D6D}.d2{background:#FFD23F}.d3{background:#3DDCFF}

/* =========== デバッグ（必要時のみ表示） =========== */
#dbg{
  position:fixed;bottom:6px;left:6px;
  font-size:9px;color:#FFD23F;opacity:.55;
  background:rgba(0,0,0,.4);padding:3px 7px;border-radius:4px;
  z-index:9999;pointer-events:none;font-family:monospace;
}
#dbg.err{color:#FF6680;opacity:1;background:rgba(80,0,20,.85);}
</style>
</head>

        { type:'enemy', x:2700, kind:'slime' },
        { type:'platform', x:2800, y:160, w:100, h:16 },
        { type:'enemy', x:2980, kind:'bird',  floatY:70 },
        { type:'enemy', x:3100, kind:'bat',   floatY:120 },
        { type:'pit', x:3200, w:130 },
        { type:'enemy', x:3400, kind:'slime' },
        { type:'goal', x:3500 },
      ],
    },
  ],
};

/* =========================================================
 * 2. Audio: BGM/SFX エンジン
 *    - unlock() はユーザージェスチャー内で同期実行
 *    - 失敗しても全ての関数が安全に no-op で済む
 * ========================================================= */
const Audio = (() => {
  let ctx = null, master, bgmGain, seGain;
  let unlocked = false, enabled = true;
  let bgmTimer = null, bgmPat = null, bgmStep = 0, bgmKey = null;
  let dbgEl = null, tones = 0;

  const log = m => { if (dbgEl && !dbgEl.classList.contains('err')) dbgEl.textContent = `audio: ${m} | tones:${tones}`; };

  function _tone(freq, dur, type='square', vol=1, dest=null) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(dest || seGain);
      osc.start(t); osc.stop(t + dur + 0.05);
      tones++; log('running');
    } catch (_) {}
  }

  function _noise(dur, vol=0.3) {
    if (!unlocked || !enabled || !ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    try {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random()*2 - 1) * (1 - i/len);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const g = ctx.createGain(); g.gain.value = vol;
      src.connect(g); g.connect(seGain); src.start();
    } catch (_) {}
  }

  function _tickBgm() {
    if (!bgmPat || !enabled || !unlocked) return;
    const N = Config.notes, idx = bgmStep % bgmPat.len;
    const m = bgmPat.melody[idx], b = bgmPat.bass[idx];
    const dur = bgmPat.tempo * 0.95;
    if (m && N[m]) _tone(N[m], dur, 'square',   1, bgmGain);
    if (b && N[b]) _tone(N[b], dur, 'triangle', 1, bgmGain);
    bgmStep++;
    bgmTimer = setTimeout(_tickBgm, bgmPat.tempo * 1000);
  }

  return {
    setDbgEl(el) { dbgEl = el; log('ready'); },

    unlock() {
      if (unlocked) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { log('unsupported'); return; }
      try {
        ctx = new AC();
        // iOS Safari: 無音バッファを即座に再生してアンロック
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination); src.start(0);
        if (ctx.state === 'suspended') ctx.resume();
        master  = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.15; bgmGain.connect(master);
        seGain  = ctx.createGain(); seGain.gain.value  = 0.5;  seGain.connect(master);
        unlocked = true;
        log(`unlocked (${ctx.state})`);
      } catch (e) { log(`init err: ${e.message}`); }
    },

    startBgm(key) {
      this.stopBgm();
      bgmKey = key;
      if (!unlocked || !enabled) return;
      bgmPat = Config.bgm[key]; if (!bgmPat) return;
      bgmStep = 0; _tickBgm();
    },

    stopBgm() {
      if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
      bgmPat = null;
    },

    setEnabled(v) {
      enabled = v;
      if (!enabled) this.stopBgm();
      else if (bgmKey) this.startBgm(bgmKey);
    },

    isEnabled: () => enabled,

    sfx: {
      jump() {
        if (!unlocked || !enabled || !ctx) return;
        try {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = 'square';
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.1);
          g.gain.setValueAtTime(0.3, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(g); g.connect(seGain); osc.start(t); osc.stop(t + 0.15);
        } catch (_) {}
      },
      coin() {
        const N = Config.notes;
        _tone(N.E5, 0.08, 'square', 0.5);
        setTimeout(() => _tone(N.G5, 0.15, 'square', 0.5), 70);
      },
      slide() { _noise(0.15, 0.15); },
      enemy() {
        if (!unlocked || !enabled || !ctx) return;
        try {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.type = 'square';
          const t = ctx.currentTime;
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(110, t + 0.2);
          g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.connect(g); g.connect(seGain); osc.start(t); osc.stop(t + 0.25);
        } catch (_) {}
        _noise(0.1, 0.2);
      },
      goal()    { const N=Config.notes; ['C5','E5','G5','C6'].forEach((k,i)=>setTimeout(()=>_tone(N[k],0.25,'square',0.5), i*100)); },
      gameOver(){ const N=Config.notes; ['G4','F4','E4','D4','C4'].forEach((k,i)=>setTimeout(()=>_tone(N[k],0.2,'triangle',0.4), i*120)); },
    },
  };
})();

/* =========================================================
 * 3. Player / Stage / Physics
 * ========================================================= */
class Player {
  constructor() {
    const pc = Config.player;
    this.x = 80; this.y = 0;
    this.w = pc.w; this.h = pc.h;
    this.vy = 0;
    this.grounded = true; this.jumping = false;
    this.sliding = false; this.slideTimer = 0;
    this.holdingJump = false; this.holdTimer = 0;
    this.animTime = 0; this.finishing = false;
  }
  tryJump() {
    if (!this.grounded || this.sliding) return false;
    this.vy = Config.player.jump;
    this.grounded = false; this.jumping = true;
    this.holdingJump = true; this.holdTimer = 0;
    return true;
  }
  releaseJump() { this.holdingJump = false; }
  trySlide() {
    if (!this.grounded || this.sliding) return false;
    this.sliding = true; this.slideTimer = 0;
    return true;
  }
  hitbox() { return { x:this.x, y:this.y, w:this.w, h:this.sliding ? 24 : this.h }; }
}

class Stage {
  constructor(data) {
    this.data = data;
    this.platforms = []; this.coins = []; this.enemies = []; this.pits = [];
    this.goal = null;
    for (const o of data.objects) {
      switch (o.type) {
        case 'platform': this.platforms.push({ x:o.x, y:o.y, w:o.w, h:o.h }); break;
        case 'coin':     this.coins.push({ x:o.x, y:o.y, r:12, collected:false, anim:Math.random()*Math.PI*2 }); break;
        case 'enemy':    this.enemies.push(Stage._enemy(o)); break;
        case 'pit':      this.pits.push({ x:o.x, w:o.w }); break;
        case 'goal':     this.goal = { x:o.x }; break;
      }
    }
    // ステージの右端（カメラの上限を決めるのに使う）
    this.length = Math.max(...data.objects.map(o => o.x || 0)) + 400;
  }
  static _enemy(o) {
    const base = { x:o.x, y:0, alive:true, anim:0, kind:o.kind };
    switch (o.kind) {
      case 'bat':  return { ...base, w:34, h:24, vx:-2.5, baseY:o.floatY||120, amp:40, waveSpd:2.5 };
      case 'bird': return { ...base, w:38, h:26, vx:-4.5, baseY:o.floatY||60,  amp:0,  waveSpd:0   };
      default:     return { ...base, w:36, h:30, vx:-2.2, baseY:0,             amp:0,  waveSpd:0   };
    }
  }
}

const Physics = {
  update(player, stage, dt, fx) {
    const pc = Config.player;

    if (player.holdingJump && player.jumping) {
      player.holdTimer += dt;
      if (player.holdTimer < pc.holdTime && player.vy > 0) player.vy += pc.holdForce;
    }
    if (player.sliding) {
      player.slideTimer += dt;
      if (player.slideTimer > pc.slideTime) player.sliding = false;
    }

    if (!player.finishing) {
      player.x += player.sliding ? pc.speed * pc.slideBoost : pc.speed;
    }

    player.vy -= pc.gravity;
    player.y  += player.vy;

    // プラットフォーム着地
    let onPlatform = false;
    if (player.vy <= 0) {
      for (const p of stage.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
          const top = p.y + p.h;
          if (player.y <= top && player.y >= top - 16 - Math.abs(player.vy)) {
            player.y = top; player.vy = 0;
            player.grounded = true; player.jumping = false;
            onPlatform = true; break;
          }
        }
      }
    }

    // 地面 or 穴
    if (!onPlatform) {
      const cx = player.x + player.w / 2;
      const inPit = stage.pits.some(p => cx > p.x && cx < p.x + p.w);
      if (!inPit && player.y <= 0) {
        player.y = 0; player.vy = 0;
        player.grounded = true; player.jumping = false;
      } else {
        player.grounded = false;
      }
    }

    if (player.y < -120) { fx.onDeath(); return; }

    // 敵
    for (const e of stage.enemies) {
      if (!e.alive) continue;
      e.anim += dt; e.x += e.vx;
      if (e.kind === 'bat' || e.kind === 'bird') {
        e.y = e.baseY + Math.sin(e.anim * e.waveSpd) * e.amp;
      }
      if (!this._hitEnemy(player, e)) continue;
      if (e.kind === 'bat' || e.kind === 'bird') {
        fx.onDeath(); return;
      } else if (player.vy < -3 && player.y + player.hitbox().h >= e.y + e.h - 10) {
        e.alive = false; player.vy = pc.stomped; fx.onEnemyDefeat(e);
      } else if (player.sliding) {
        e.alive = false; fx.onEnemyDefeat(e);
      } else {
        fx.onDeath(); return;
      }
    }

    // コイン
    for (const c of stage.coins) {
      if (c.collected) continue;
      c.anim += dt * 4;
      const dx = player.x + player.w/2 - c.x;
      const dy = player.y + player.h/2 - c.y;
      if (dx*dx + dy*dy < (c.r+18)*(c.r+18)) { c.collected = true; fx.onCoin(c); }
    }

    // ゴール
    if (stage.goal && !player.finishing && player.x + player.w/2 >= stage.goal.x) {
      player.finishing = true; fx.onGoal();
    }

    player.animTime += dt;
  },

  _hitEnemy(player, e) {
    const hb = player.hitbox();
    return hb.x + hb.w > e.x && hb.x < e.x + e.w
        && hb.y < e.y + e.h && hb.y + hb.h > e.y;
  },
};

/* =========================================================
 * 4. Renderer
 *    - 背景・敵・キャラ・パーティクルを描画
 *    - キャンバスのバッキングストアサイズは初期化時に1度だけ設定
 *    - 表示サイズは CSS（aspect-ratio）が担当するので resize 監視不要
 * ========================================================= */
const BgRenderer = {
  draw(ctx, stage, camera, VW, VH, groundY) {
    // 1. 空（カメラに無関係）
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    if (stage) { g.addColorStop(0, stage.data.bgColor[0]); g.addColorStop(1, stage.data.bgColor[1]); }
    else { g.addColorStop(0, '#87CEEB'); g.addColorStop(1, '#E8D5A3'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    // 2. 太陽
    ctx.save();
    ctx.fillStyle = '#FFE066'; ctx.globalAlpha = 0.88;
    ctx.beginPath(); ctx.arc(VW - 80, 80, 34, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 3; ctx.globalAlpha = 0.35;
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(VW-80+Math.cos(a)*42, 80+Math.sin(a)*42);
      ctx.lineTo(VW-80+Math.cos(a)*58, 80+Math.sin(a)*58);
      ctx.stroke();
    }
    ctx.restore();

    // 3. 雲（カメラに応じてパララックス）
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    const o = (camera.x * 0.15) % (VW + 200);
    [[VW*.2-o,100],[VW*.6-o*.7,70],[VW-o*.4,130],[VW*1.4-o,90]].forEach(([x,y]) => {
      ctx.beginPath();
      ctx.arc(x,y,24,0,Math.PI*2); ctx.arc(x+20,y-6,22,0,Math.PI*2); ctx.arc(x+40,y,20,0,Math.PI*2);
      ctx.fill();
    });

    if (!stage) return;

    // 4. ワールド座標系（カメラ移動を適用）
    ctx.save();
    ctx.translate(-camera.x, 0);

    // 丘（パララックス）
    ctx.fillStyle = 'rgba(100,180,80,.38)';
    const hoff = camera.x * 0.25;
    for (let i = -1; i < 8; i++) {
      const x = camera.x + i*300 - (hoff%300);
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.bezierCurveTo(x+60, groundY-110, x+180, groundY-110, x+300, groundY);
      ctx.closePath(); ctx.fill();
    }

    // 地面
    ctx.fillStyle = '#8B6914'; ctx.fillRect(camera.x, groundY, VW, VH - groundY);
    ctx.fillStyle = '#7CBA3D'; ctx.fillRect(camera.x, groundY, VW, 11);

    // 落とし穴
    ctx.fillStyle = '#0B0F1E';
    for (const p of stage.pits) ctx.fillRect(p.x, groundY, p.w, VH-groundY);

    // 草
    ctx.fillStyle = '#5DAA2E';
    for (let x = Math.floor(camera.x/30)*30; x < camera.x+VW; x += 30) {
      if (!stage.pits.some(p => x > p.x-10 && x < p.x+p.w+10)) {
        ctx.fillRect(x, groundY-4, 4, 8);
        ctx.fillRect(x+8, groundY-3, 3, 6);
      }
    }

    // プラットフォーム
    for (const p of stage.platforms) {
      const y = groundY - p.y - p.h;
      ctx.fillStyle = '#8B5A2B'; ctx.fillRect(p.x, y, p.w, p.h);
      ctx.fillStyle = '#7CBA3D'; ctx.fillRect(p.x, y, p.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      for (let i = 0; i < p.w; i += 20) ctx.fillRect(p.x+i, y+6, 1, p.h-6);
    }

    ctx.restore();
  },
};

const EnemyRenderer = {
  draw(ctx, e, groundY) {
    if (!e.alive) return;
    if      (e.kind === 'bat')  this._bat(ctx, e, groundY);
    else if (e.kind === 'bird') this._bird(ctx, e, groundY);
    else                        this._slime(ctx, e, groundY);
  },
  _slime(ctx, e, groundY) {
    const y = groundY - e.h, sq = Math.sin(e.anim*5)*0.1;
    ctx.save(); ctx.translate(e.x+e.w/2, y+e.h);
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0,4,18,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9c27b0'; ctx.beginPath(); ctx.ellipse(0,-e.h/2,e.w/2,e.h/2+sq*5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.ellipse(-6,-e.h/2-4,4,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-e.h/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  _bat(ctx, e, groundY) {
    const sy = groundY - e.y - e.h, flap = Math.sin(e.anim*12)*0.4;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    ctx.fillStyle='#5c2a8a';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*22,-8+flap*18,dir*30,4+flap*10);
      ctx.quadraticCurveTo(dir*18,8,0,4); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    ctx.fillStyle='#7b3fad'; ctx.beginPath(); ctx.ellipse(0,2,10,10,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c2a8a';
    ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(-8,-14); ctx.lineTo(-2,-8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,-6);  ctx.lineTo(8,-14);  ctx.lineTo(2,-8);  ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FF4D6D'; ctx.beginPath(); ctx.arc(-4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-1,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  _bird(ctx, e, groundY) {
    const sy = groundY - e.y - e.h, flap = Math.sin(e.anim*16)*0.5;
    ctx.save(); ctx.translate(e.x+e.w/2, sy+e.h/2);
    ctx.fillStyle='#FF8C00';
    const _wing = (dir) => {
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(dir*15,-10+flap*14,dir*26,-2+flap*8);
      ctx.quadraticCurveTo(dir*12,6,0,2); ctx.closePath(); ctx.fill();
    };
    _wing(-1); _wing(1);
    ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.ellipse(0,1,11,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF6B00'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-18,-2); ctx.lineTo(-10,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0B0F2A'; ctx.beginPath(); ctx.arc(-4,-2,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-3,1,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#FFD23F'; ctx.lineWidth=1.5; ctx.globalAlpha=0.5;
    for (let i=1;i<=3;i++) { ctx.beginPath(); ctx.moveTo(8+i*7,-3+i*2); ctx.lineTo(16+i*7,-3+i*2); ctx.stroke(); }
    ctx.globalAlpha=1;
    ctx.restore();
  },
};

const CharRenderer = {
  draw(ctx, player, groundY) {
    const sy = groundY - player.y - player.h;
    const cx = player.x + player.w / 2;
    const cy = sy + player.h / 2;

    // 影
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.globalAlpha = Math.max(0.08, 0.38 - Math.abs(player.vy) * 0.02);
    ctx.beginPath();
    ctx.ellipse(cx, groundY - 2, player.sliding ? 28 : 20, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    if (player.sliding) { this._sliding(ctx, cx, groundY - 18); return; }

    const frame = Math.floor(player.animTime * 12) % 4;
    const bob = player.grounded ? Math.sin(player.animTime * 10) * 2 : 0;

    ctx.save(); ctx.translate(cx, cy + bob);
    this._tail(ctx, player); this._backLegs(ctx, player, frame);
    this._body(ctx); this._frontLegs(ctx, player, frame); this._head(ctx);
    ctx.restore();
  },
  _body(ctx) {
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(0, 7, 16, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#C8D5DC';
    ctx.beginPath(); ctx.ellipse(0, 11, 10, 8, 0, 0, Math.PI*2); ctx.fill();
  },
  _head(ctx) {
    const hy = -14;
    ctx.fillStyle = '#7A8B98';
    ctx.beginPath(); ctx.moveTo(-18,hy-2); ctx.lineTo(-23,hy-22); ctx.lineTo(-7,hy-10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 18,hy-2); ctx.lineTo( 23,hy-22); ctx.lineTo( 7,hy-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(-16,hy-4); ctx.lineTo(-19,hy-17); ctx.lineTo(-9,hy-10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 16,hy-4); ctx.lineTo( 19,hy-17); ctx.lineTo( 9,hy-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(0, hy, 21, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.ellipse(-9, hy+4, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 9, hy+4, 7, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(-8, hy-2, 7, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-2, 7, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#D4A200';
    ctx.beginPath(); ctx.ellipse(-8, hy-1, 5.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-1, 5.5, 6.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0A0F1E';
    ctx.beginPath(); ctx.ellipse(-8, hy-1, 2, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8, hy-1, 2, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';

    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(-3,hy+5); ctx.lineTo(3,hy+5); ctx.lineTo(0,hy+9); ctx.closePath(); ctx.fill();

  _tail(ctx, player) {
    const wag = Math.sin(player.animTime * 9) * 11;
    ctx.strokeStyle = '#7A8B98'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, 5);
    ctx.quadraticCurveTo(-30, -4+wag, -28, -20+wag);
    ctx.stroke();
    ctx.strokeStyle = '#D0DCE4'; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-27, -18+wag);
    ctx.quadraticCurveTo(-30, -25+wag, -27, -28+wag);
    ctx.stroke();
  },
  _frontLegs(ctx, player, frame) {
    ctx.fillStyle = '#8A9BAA';
    if (player.grounded && !player.jumping) {
      const offs = [[-9,0],[-7,-2],[-11,0],[-9,-2]], o = offs[frame];
      ctx.beginPath(); ctx.ellipse(o[0],   21+o[1], 5, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(o[0]+5, 21-o[1], 5, 8, 0, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.ellipse(-7, 16, 5, 8, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-1, 16, 5, 8, -0.3, 0, Math.PI*2); ctx.fill();
    }
  },
  _backLegs(ctx, player, frame) {
    ctx.fillStyle = '#7A8B98';
    if (player.grounded && !player.jumping) {
      const offs = [[10,-2],[12,0],[8,-2],[10,0]], o = offs[frame];
      ctx.beginPath(); ctx.ellipse(o[0], 21+o[1], 6, 9, 0, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.ellipse(12, 15, 6, 9, 0.3, 0, Math.PI*2); ctx.fill();

  _sliding(ctx, cx, y) {
    ctx.save(); ctx.translate(cx, y);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(0, 20, 30, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#7A8B98'; ctx.lineWidth = 7; ctx.lineCap = 'round';

    ctx.fillStyle = '#C8D5DC';
    ctx.beginPath(); ctx.ellipse(0, 8, 18, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9AABB8';
    ctx.beginPath(); ctx.ellipse(22, -1, 17, 15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7A8B98';
    ctx.beginPath(); ctx.moveTo(14,-10); ctx.lineTo(10,-22); ctx.lineTo(20,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24,-12); ctx.lineTo(28,-23); ctx.lineTo(32,-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFB0C0';
    ctx.beginPath(); ctx.moveTo(15,-11); ctx.lineTo(13,-18); ctx.lineTo(19,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(25,-13); ctx.lineTo(27,-19); ctx.lineTo(30,-11); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0A0F1E'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(15,-3); ctx.quadraticCurveTo(18,-6,21,-3);
    ctx.moveTo(24,-3); ctx.quadraticCurveTo(27,-6,30,-3);
    ctx.stroke();
    ctx.strokeStyle = '#3DDCFF'; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-40-i*8, -4+i*5); ctx.lineTo(-24-i*8, -4+i*5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  },
};

const Renderer = {
  canvas: null, ctx: null,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    // バッキングストアは固定サイズ。表示サイズは CSS が担当。
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width  = Config.VW * dpr;
    canvas.height = Config.VH * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  draw(state) {
    const { stage, camera, player, particles } = state;
    const { VW, VH, GROUND_Y } = Config;
    const ctx = this.ctx;

    BgRenderer.draw(ctx, stage, camera, VW, VH, GROUND_Y);
    if (!stage) return;

    ctx.save();
    ctx.translate(-camera.x, 0);

    // コイン
    for (const c of stage.coins) {
      if (c.collected) continue;
      const y = GROUND_Y - c.y, wob = Math.sin(c.anim)*3;
      ctx.save(); ctx.translate(c.x, y+wob);
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,13,9,3,0,0,Math.PI*2); ctx.fill();
      const g = ctx.createRadialGradient(-2,-2,1,0,0,11);
      g.addColorStop(0,'#FFE57F'); g.addColorStop(1,'#FFB300');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#8B6914'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle='#FFF'; ctx.fillRect(-1,-5,2,10);
      ctx.restore();
    }

    for (const e of stage.enemies)  EnemyRenderer.draw(ctx, e, GROUND_Y);
    if (stage.goal)                  NaruRenderer.draw(ctx, stage.goal, GROUND_Y);
    if (player)                      CharRenderer.draw(ctx, player, GROUND_Y);

    // パーティクル
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life*2);
      ctx.fillRect(p.x-p.size/2, GROUND_Y-p.y-p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  },
};

/* =========================================================
 * 5. UI: DOM ヘルパー
 *    各画面の表示切替・HUDのテキスト更新のみを担当
 * ========================================================= */
const UI = {
  el: {},
  init() {
    const ids = [
      'title','hud','tutorial','storyModal','resultModal','gameOverModal','pauseModal',
      'stageLabel','coinCount','timer','resultStars','resultScore','resultTime','resultCoins',
      'nextBtn','storyIcon','storyTitle','storyText','dbg',
    ];
    ids.forEach(id => this.el[id] = document.getElementById(id));
  },
  show(id) { this.el[id].classList.add('show'); },
  hide(id) { this.el[id].classList.remove('show'); },
  hideAllOverlays() {
    ['title','tutorial','storyModal','resultModal','gameOverModal','pauseModal'].forEach(id => this.hide(id));
  },
  setStage(label)  { this.el.stageLabel.textContent = `STAGE ${label}`; },
  setCoins(n)      { this.el.coinCount.textContent  = `🔔 ${n}`; },
  setTimer(secs)   {
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = Math.floor(secs%60).toString().padStart(2,'0');
    this.el.timer.textContent = `${m}:${s}`;
  },
  setSoundIcon(on, btn) { btn.textContent = on ? '🔊' : '🔇'; btn.classList.toggle('off', !on); },

  showStory(story, onClose) {
    this.el.storyIcon.textContent  = story.icon;
    this.el.storyTitle.textContent = story.title;
    this.el.storyText.textContent  = story.text;
    this._storyClose = onClose;
    this.show('storyModal');
  },
  closeStory() {
    this.hide('storyModal');
    const cb = this._storyClose; this._storyClose = null;
    if (cb) cb();
  },

  showResult(stars, score, secs, coins, hasNext) {
    this.el.resultStars.textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
    this.el.resultScore.textContent = score;
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = Math.floor(secs%60).toString().padStart(2,'0');
    this.el.resultTime.textContent  = `${m}:${s}`;
    this.el.resultCoins.textContent = coins;
    this.el.nextBtn.style.display = hasNext ? 'block' : 'none';
    this.show('resultModal');
  },

  reportError(msg) {
    if (!this.el.dbg) return;
    this.el.dbg.classList.add('err');
    this.el.dbg.textContent = `ERR: ${msg}`.slice(0, 200);
  },
};

/* =========================================================
 * 6. Game: ステートマシン
 *
 * 状態遷移図:
 *   TITLE → STORY → TUTORIAL → PLAYING ⇄ PAUSED
 *                     ↑               ↓
 *                     └──RETRY──── RESULT / GAMEOVER → TITLE
 *
 *   各遷移は Game.actions の関数1個に対応し、
 *   HTML の data-action 属性 から呼ばれる。
 * ========================================================= */
const MODE = { TITLE:'title', STORY:'story', TUTORIAL:'tutorial', PLAYING:'playing', PAUSED:'paused', RESULT:'result', GAMEOVER:'gameover' };

const Game = {
  state: {
    mode: MODE.TITLE,
    stageIdx: 0,
    stage: null, player: null,
    camera: { x:0 },
    coins: 0, timer: 0, particles: [],
    seenTutorial: false,
  },

  // ----- ライフサイクル -----
  init() {
    UI.show('title');
    Audio.startBgm('title');
  },

  _loadStage(idx) {
    const s = this.state;
    s.stageIdx  = idx;
    s.stage     = new Stage(Config.stages[idx]);
    s.player    = new Player();
    s.camera.x  = 0;
    s.coins     = 0;
    s.timer     = 0;
    s.particles = [];
    UI.setStage(s.stage.data.id);
    UI.setCoins(0); UI.setTimer(0);
    UI.el.hud.classList.add('show');
    Audio.startBgm(s.stage.data.bgmKey);
  },

  _addParticles(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      this.state.particles.push({
        x, y,
        vx: (Math.random()-.5)*6,
        vy: Math.random()*5+2,
        life: 0.5+Math.random()*0.3,
        color, size: 3+Math.random()*2,
      });
    }
  },

  // ----- Physics コールバック -----
  fx: {
    onCoin(c) {
      Game.state.coins++;
      Game._addParticles(c.x, c.y, 6, '#FFD23F');
      Audio.sfx.coin();
    },
    onEnemyDefeat(e) {
      Game._addParticles(e.x+e.w/2, e.y+e.h/2, 8, '#FF4D6D');
      Audio.sfx.enemy();
    },
    onGoal()  { Game._stageClear(); },
    onDeath() { Game._gameOver(); },
  },

  _stageClear() {
    const s = this.state;
    s.mode = MODE.RESULT;
    Audio.stopBgm(); Audio.sfx.goal();

    const sc = Config.score;
    const timeBonus = Math.max(0, Math.floor((sc.timeBonusCap - s.timer) * sc.timeBonus));
    const score = s.coins * sc.coinVal + timeBonus + sc.clearBonus;
    const stars = score >= sc.star3 ? 3 : score >= sc.star2 ? 2 : 1;
    const hasNext = s.stageIdx < Config.stages.length - 1;

    setTimeout(() => {
      const next = Config.stages[s.stageIdx + 1];
      if (hasNext && next && next.story) {
        UI.showStory(next.story, () => UI.showResult(stars, score, s.timer, s.coins, hasNext));
      } else {
        UI.showResult(stars, score, s.timer, s.coins, hasNext);
      }
    }, 800);
  },

  _gameOver() {
    this.state.mode = MODE.GAMEOVER;
    Audio.stopBgm(); Audio.sfx.gameOver();
    UI.show('gameOverModal');
  },

  // ----- 入力ハンドラ -----
  onJumpStart() {
    if (this.state.mode !== MODE.PLAYING) return;
    if (this.state.player.tryJump()) {
      this._addParticles(this.state.player.x+this.state.player.w/2, this.state.player.y, 6, '#FFD23F');
      Audio.sfx.jump();
    }
  },
  onJumpEnd() { if (this.state.player) this.state.player.releaseJump(); },
  onSlide() {
    if (this.state.mode !== MODE.PLAYING) return;
    if (this.state.player.trySlide()) {
      this._addParticles(this.state.player.x+this.state.player.w/2, this.state.player.y+4, 4, '#3DDCFF');
      Audio.sfx.slide();
    }
  },

  // ----- UI から呼ばれるアクション（data-action 名と一致） -----
  actions: {
    startFromTitle() {
      Audio.unlock();
      Audio.sfx.coin();
      UI.hide('title');
      Game.state.mode = MODE.STORY;
      UI.showStory(Config.stages[0].story, () => Game.actions.afterFirstStory());
    },
    afterFirstStory() {
      Game._loadStage(0);
      if (!Game.state.seenTutorial) {
        Game.state.mode = MODE.TUTORIAL;
        UI.show('tutorial');
      } else {
        Game.state.mode = MODE.PLAYING;
      }
    },
    storyNext() {
      // ストーリー閉じ。状態は UI.closeStory のコールバックが進める。
      UI.closeStory();
    },
    dismissTutorial() {
      if (Game.state.mode !== MODE.TUTORIAL) return;
      UI.hide('tutorial');
      Game.state.seenTutorial = true;
      Game.state.mode = MODE.PLAYING;
    },
    pause() {
      if (Game.state.mode !== MODE.PLAYING) return;
      Game.state.mode = MODE.PAUSED;
      Audio.stopBgm();
      UI.show('pauseModal');
    },
    resume() {
      if (Game.state.mode !== MODE.PAUSED) return;
      UI.hide('pauseModal');
      Game.state.mode = MODE.PLAYING;
      Audio.startBgm(Game.state.stage.data.bgmKey);
    },
    retry() {
      UI.hideAllOverlays();
      Game._loadStage(Game.state.stageIdx);
      Game.state.mode = MODE.PLAYING;
    },
    nextStage() {
      UI.hide('resultModal');
      if (Game.state.stageIdx < Config.stages.length - 1) {
        Game._loadStage(Game.state.stageIdx + 1);
        Game.state.mode = MODE.PLAYING;
      } else {
        Game.actions.backToTitle();
      }
    },
    backToTitle() {
      UI.hideAllOverlays();
      UI.el.hud.classList.remove('show');
      UI.show('title');
      Game.state.mode = MODE.TITLE;
      Audio.startBgm('title');
    },
    toggleSound(btn) {
      Audio.unlock();
      const next = !Audio.isEnabled();
      Audio.setEnabled(next);
      UI.setSoundIcon(next, btn);
      if (next) Audio.sfx.coin();
    },
  },

  // ----- ループ -----
  update(dt) {
    if (this.state.mode !== MODE.PLAYING) return;
    const s = this.state;
    s.timer += dt;
    Physics.update(s.player, s.stage, dt, this.fx);

    // カメラ追従（プレイヤーを画面30%に保つ）
    const tx = s.player.x - Config.VW * 0.30;
    s.camera.x += (tx - s.camera.x) * 0.15;
    s.camera.x = Math.max(0, Math.min(s.camera.x, s.stage.length - Config.VW));

    // パーティクル
    for (let i = s.particles.length-1; i >= 0; i--) {
      const p = s.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy -= 0.3; p.life -= dt;
      if (p.life <= 0) s.particles.splice(i, 1);
    }

    UI.setCoins(s.coins);
    UI.setTimer(s.timer);
  },
};

/* =========================================================
 * 7. Input: ポインタ＋キーボード入力
 *    PointerEvents で touch/mouse/pen を統一。
 *    UI要素（data-action 持ち / button）の上ではゲーム入力を発火しない。
 * ========================================================= */
const Input = {
  startY: null, swiped: false, gestureOnUI: false,

  init() {
    document.addEventListener('pointerdown', e => this._down(e), { passive: false });
    document.addEventListener('pointermove', e => this._move(e), { passive: false });
    document.addEventListener('pointerup',   e => this._up(e),   { passive: false });
    document.addEventListener('pointercancel', () => { this.startY = null; this.gestureOnUI = false; });

    // data-action のクリック委譲（PointerEvents由来のclickもここで処理）
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const fn = Game.actions[t.dataset.action];
      if (fn) fn(t);
    });

    document.addEventListener('keydown', e => {
      if (Game.state.mode !== MODE.PLAYING) return;
      if (e.code === 'Space' || e.code === 'ArrowUp')   { e.preventDefault(); Game.onJumpStart(); }
      else if (e.code === 'ArrowDown')                  { e.preventDefault(); Game.onSlide(); }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') Game.onJumpEnd();
    });
  },

  // UI 要素（クリック対象）の上では preventDefault を呼ばない。
  // → click イベントが正常に発火し、上の data-action ディスパッチが動く。
  _isUI(el) {
    while (el && el !== document.body) {
      if (el.tagName === 'BUTTON') return true;
      if (el.dataset && el.dataset.action) return true;
      el = el.parentElement;
    }
    return false;
  },

  _down(e) {
    this.gestureOnUI = this._isUI(e.target);
    if (this.gestureOnUI) return;
    // プレイ中以外は preventDefault しない（モーダル外のタップが暴発しないように）
    if (Game.state.mode !== MODE.PLAYING) return;
    e.preventDefault();
    this.startY = e.clientY;
    this.swiped = false;
    Game.onJumpStart();
  },
  _move(e) {
    if (this.gestureOnUI || this.startY === null) return;
    if (Game.state.mode !== MODE.PLAYING) return;
    e.preventDefault();
    if (e.clientY - this.startY > Config.input.swipeThreshold && !this.swiped) {
      this.swiped = true;
      Game.onSlide();
    }
  },
  _up(e) {
    if (this.gestureOnUI) { this.gestureOnUI = false; return; }
    if (this.startY === null) return;
    if (Game.state.mode === MODE.PLAYING) e.preventDefault();
    this.startY = null;
    Game.onJumpEnd();
  },
};

/* =========================================================
 * 8. Bootstrap
 * ========================================================= */
(function main() {
  UI.init();
  Audio.setDbgEl(UI.el.dbg);
  Renderer.init(document.getElementById('game'));
  Input.init();
  Game.init();

  // 致命的なエラーが起きたらデバッグ表示に出す（ループは継続）
  window.addEventListener('error', e => UI.reportError((e.error && e.error.message) || e.message));
  window.addEventListener('unhandledrejection', e => UI.reportError((e.reason && e.reason.message) || String(e.reason)));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    try {
      Game.update(dt);
      Renderer.draw(Game.state);
    } catch (e) {
      UI.reportError(e.message);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
